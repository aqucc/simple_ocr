<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-jd7og4OQ/s8gvZKHzkt7UFK0963dDoHsXyLxWeQLNZY=' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'sha256-8P0MTLtYZVqNYsgxcMTv9j8xnHYwOipaxwNdmBIDCmQ='; img-src 'self' blob: data:; connect-src 'self' https://cdn.jsdelivr.net data:; worker-src blob:; base-uri 'none'; form-action 'none'">
<title>ラベルOCR</title>
<style>
:root{
  --bg:#0f1115; --panel:#1a1d24; --panel2:#232732; --line:#2e3440;
  --fg:#e8eaf0; --muted:#9aa3b2; --accent:#4c8dff; --accent2:#2f6fe0;
  --danger:#ff5a5f; --ok:#37c871; --radius:14px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f2f4f8; --panel:#ffffff; --panel2:#eef1f6; --line:#d8dee9;
    --fg:#1a1d24; --muted:#5b6472; --accent:#2f6fe0; --accent2:#1f5bc4; }
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:16px; line-height:1.5; }
#app{ max-width:680px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
header{ position:sticky; top:0; z-index:10; background:var(--panel);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px; }
header h1{ font-size:17px; margin:0 0 8px; text-align:center; font-weight:700; }
.nav{ display:flex; gap:8px; }
.nav button{ flex:1; min-height:44px; border:1px solid var(--line); background:var(--panel2);
  color:var(--fg); border-radius:10px; font-size:15px; font-weight:600; }
.nav button.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
main{ flex:1; padding:14px 12px calc(env(safe-area-inset-bottom) + 28px); }
.card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; margin-bottom:14px; }
.btn{ display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; min-height:52px; border:none; border-radius:12px; font-size:16px;
  font-weight:700; color:#fff; background:var(--accent); margin:0; }
.btn:active{ background:var(--accent2); }
.btn.sec{ background:var(--panel2); color:var(--fg); border:1px solid var(--line); }
.btn.danger{ background:var(--danger); }
.btn.ok{ background:var(--ok); }
.btn-row{ display:flex; gap:10px; }
.btn-row .btn{ flex:1; }
.hidden-file{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
label.filebtn{ cursor:pointer; }
.hint{ color:var(--muted); font-size:13px; margin:8px 2px 0; }
.err{ background:rgba(255,90,95,.14); border:1px solid var(--danger); color:var(--danger);
  padding:10px 12px; border-radius:10px; font-size:14px; margin-bottom:12px; white-space:pre-wrap; }
.preview{ width:100%; border-radius:10px; display:block; background:var(--panel2);
  border:1px solid var(--line); max-height:46vh; object-fit:contain; }
textarea{ width:100%; min-height:120px; resize:vertical; background:var(--panel2);
  color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:10px;
  font-size:16px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
.progwrap{ margin:10px 0; }
.progbar{ height:12px; background:var(--panel2); border:1px solid var(--line);
  border-radius:8px; overflow:hidden; }
.progfill{ height:100%; background:var(--accent); transition:width .2s ease; }
.progtxt{ font-size:13px; color:var(--muted); margin-top:6px; text-align:center; }
.conf{ font-size:13px; color:var(--muted); margin:8px 2px; }
.wfrow{ display:flex; align-items:center; justify-content:space-between; margin:2px 2px 8px; }
.wflabel{ font-size:13px; color:var(--muted); font-weight:700; }
.wftoggle{ min-width:64px; min-height:30px; padding:0 14px; border-radius:15px;
  border:1px solid var(--line); background:var(--panel2); color:var(--muted);
  font-size:12px; font-weight:800; letter-spacing:.03em; }
.wftoggle.on{ background:var(--ok); border-color:var(--ok); color:#fff; }
.engine{ font-size:13px; color:var(--muted); margin:2px 2px 8px; }
.engine b{ color:var(--fg); }
h2.sec{ font-size:14px; color:var(--muted); margin:2px 2px 10px; font-weight:700; }
/* ---- crop stage ---- */
.crop-stage{ position:relative; width:100%; margin:2px 0 4px; touch-action:none;
  user-select:none; -webkit-user-select:none; background:var(--panel2);
  border:1px solid var(--line); border-radius:10px; overflow:hidden; }
/* No max-height/object-fit: the overlay's %-coordinates must map 1:1 onto the
   image box, so the stage must be exactly the image's own aspect ratio. */
.crop-img{ display:block; width:100%; height:auto; pointer-events:none; }
.crop-overlay{ position:absolute; border:2px solid var(--accent);
  box-shadow:0 0 0 100vmax rgba(0,0,0,.5); box-sizing:border-box; cursor:move; touch-action:none; }
.crop-handle{ position:absolute; width:30px; height:30px; background:var(--accent);
  border:2px solid #fff; border-radius:50%; touch-action:none; }
.crop-handle.nw{ left:-15px; top:-15px; cursor:nwse-resize; }
.crop-handle.ne{ right:-15px; top:-15px; cursor:nesw-resize; }
.crop-handle.sw{ left:-15px; bottom:-15px; cursor:nesw-resize; }
.crop-handle.se{ right:-15px; bottom:-15px; cursor:nwse-resize; }
.cal{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; margin-bottom:14px; }
.calhead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.calhead .mlabel{ font-weight:700; font-size:15px; }
.calnav{ min-width:44px; min-height:44px; border:1px solid var(--line); background:var(--panel2);
  color:var(--fg); border-radius:10px; font-size:18px; }
.calgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.caldow{ text-align:center; font-size:12px; color:var(--muted); padding:4px 0; }
.calcell{ position:relative; aspect-ratio:1/1; border:1px solid transparent; border-radius:9px;
  background:transparent; color:var(--fg); font-size:14px; display:flex;
  align-items:center; justify-content:center; }
.calcell.has{ background:var(--panel2); border-color:var(--line); font-weight:700; }
.calcell.sel{ background:var(--accent); color:#fff; border-color:var(--accent); }
.calcell.empty{ background:transparent; }
.caldot{ position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
  min-width:15px; height:15px; padding:0 3px; border-radius:8px; background:var(--accent);
  color:#fff; font-size:10px; line-height:15px; text-align:center; }
.calcell.sel .caldot{ background:#fff; color:var(--accent); }
.datehdr{ font-size:14px; font-weight:700; color:var(--muted); margin:16px 2px 8px;
  padding-bottom:6px; border-bottom:1px solid var(--line); }
.rec{ display:flex; gap:12px; }
.rec .thumb{ width:74px; height:74px; flex:0 0 74px; border-radius:10px; object-fit:cover;
  background:var(--panel2); border:1px solid var(--line); }
.rec .body{ flex:1; min-width:0; }
.rec .time{ font-size:12px; color:var(--muted); }
.rec .txt{ white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,Menlo,monospace;
  font-size:14px; margin:4px 0 8px; }
/* Action buttons: two rows (primary: コピー/再読み取り, secondary: 編集/削除)
   instead of 4-across so each target stays >=44px tall with >=8px gaps even
   at 375px width. 削除 gets a tinted danger background (not just a border) so
   it reads as visually distinct from the neutral row above it. */
.rec .acts{ display:flex; flex-direction:column; gap:8px; }
.rec .acts .actrow{ display:flex; gap:8px; }
.rec .acts button{ flex:1; min-height:44px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel2); color:var(--fg); font-size:14px; font-weight:600; }
.rec .acts button.del{ background:rgba(255,90,95,.14); color:var(--danger); border-color:var(--danger); }
.rec textarea{ min-height:88px; font-size:14px; margin:4px 0 0; }
.rec .editrow{ display:flex; gap:8px; margin-top:8px; }
.rec .editrow button{ flex:1; min-height:44px; border-radius:10px; border:none;
  font-size:14px; font-weight:700; }
.rec .editrow button.save{ background:var(--ok); color:#fff; }
.rec .editrow button.cancel{ background:var(--panel2); color:var(--fg); border:1px solid var(--line); }
.empty-note{ text-align:center; color:var(--muted); padding:30px 10px; }
.spinner{ width:20px; height:20px; border:3px solid rgba(255,255,255,.4);
  border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
details.acc{ margin-top:8px; }
details.acc summary{ list-style:none; cursor:pointer; min-height:44px;
  display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px;
  -webkit-user-select:none; user-select:none; }
details.acc summary::-webkit-details-marker{ display:none; }
details.acc summary::before{ content:"▸"; font-size:11px; transition:transform .15s ease; }
details.acc[open] summary::before{ transform:rotate(90deg); }
details.acc .hint{ margin-top:0; }
.rec .thumb{ cursor:zoom-in; }
.lightbox{ position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.88);
  display:flex; align-items:center; justify-content:center; padding:16px; cursor:zoom-out; }
.lightbox img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }
.lightbox-close{ position:absolute; top:calc(env(safe-area-inset-top) + 12px); right:12px;
  min-width:44px; min-height:44px; border:none; border-radius:22px;
  background:rgba(255,255,255,.18); color:#fff; font-size:22px; line-height:1; }
.toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 20px);
  transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:10px 16px;
  border-radius:20px; font-size:14px; font-weight:600; z-index:50; max-width:90%; }
</style>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.runtime.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
"use strict";
(function () {
  const { createApp, h, ref, computed, onMounted } = Vue;

  // ---- Pinned CDN dependency paths (Tesseract runtime assets) ----
  const TESS = {
    workerPath: "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",
    corePath: "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1"
  };
  // Traineddata is SELF-HOSTED under a same-origin tessdata/ directory
  // (eng.traineddata.gz + jpn.traineddata.gz committed in the repo), NOT
  // pulled from the two separate @tesseract.js-data/* npm packages on
  // jsdelivr. Self-hosting is what lets the 日本語 worker load a COMBINED
  // "jpn+eng" model from a single langPath: jpn.traineddata alone is weak on
  // half-width ASCII digits embedded in kanji text (an address like
  // 東京都千代田区1-2-3 loses/garbles the 1-2-3), and jpn+eng is the
  // established remedy. Both languages are served from the same base URL, so
  // Tesseract can resolve both files. The langPath is resolved RELATIVE to the
  // document (new URL below), so it works when the app is served from a
  // subpath (GitHub Pages: /simple_ocr/tessdata) and not only from the root.
  // Note: over file:// this fetch fails (no origin) — HTTP(S) serving required
  // for OCR, same as the other CDN assets.
  const TESSDATA_PATH = new URL("tessdata", document.baseURI).href.replace(/\/$/, "");
  const TESS_LANGS = {
    eng: { lang: "eng", langPath: TESSDATA_PATH },
    jpn: { lang: "jpn+eng", langPath: TESSDATA_PATH }
  };
  const LANG_MODE_KEY = "label_ocr_lang_mode";

  // ---- Pinned PaddleOCR (ONNX / onnxruntime-web) assets ----
  // The cropped 英数字 path runs PP-OCRv4 recognition (rec-only, no detection):
  // the user has already isolated the text region, so we skip DBNet, split the
  // crop into lines by projection profile, and CTC-greedy-decode each line.
  // onnxruntime-web runs single-threaded (GitHub Pages sends no COOP/COEP, so
  // SharedArrayBuffer is unavailable); SIMD is used, the proxy worker is off.
  const ORT_VER = "1.19.2";
  const ORT = {
    script: "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.wasm.min.js",
    wasmDir: "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/"
  };
  const PADDLE = {
    rec: "https://cdn.jsdelivr.net/npm/@gutenye/ocr-models@1.4.2/assets/ch_PP-OCRv4_rec_infer.onnx",
    dict: "https://cdn.jsdelivr.net/npm/@gutenye/ocr-models@1.4.2/assets/ppocr_keys_v1.txt"
  };
  // PP-OCR rec normalization: (x/255 - 0.5) / 0.5, channel order B,G,R (cv2/BGR,
  // matching PaddleOCR training). Height fixed to 48, width kept proportional.
  const REC_H = 48;

  // ---- Pinned English wordlist (単語フィルタ dictionary check) ----
  // npm `word-list` (Sindre Sorhus): a plain lowercase words.txt, ~274k
  // entries, ~2.68MB raw / ~697KB gzip over the wire (verified against the
  // npm tarball). Fetched lazily on first use of the word filter, not at
  // page load.
  const WORD_LIST_URL = "https://cdn.jsdelivr.net/npm/word-list@4.1.0/words.txt";
  const WORD_FILTER_KEY = "label_ocr_word_filter_on";
  function loadWordFilterPref() {
    try {
      const v = localStorage.getItem(WORD_FILTER_KEY);
      return v === null ? true : v === "1";
    } catch (e) { return true; }
  }

  // ---------------- IndexedDB ----------------
  const DB_NAME = "label_ocr_db", STORE = "records", DB_VER = 1;
  function openDB() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains(STORE)) {
          const os = db.createObjectStore(STORE, { keyPath: "id" });
          os.createIndex("dateKey", "dateKey", { unique: false });
        }
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error || new Error("IndexedDB open failed"));
    });
  }
  async function dbPut(rec) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(rec);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error || new Error("保存に失敗しました"));
    });
  }
  async function dbAll() {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readonly");
      const rq = tx.objectStore(STORE).getAll();
      rq.onsuccess = () => res(rq.result || []);
      rq.onerror = () => rej(rq.error || new Error("読み込みに失敗しました"));
    });
  }
  async function dbDelete(id) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error || new Error("削除に失敗しました"));
    });
  }

  // ---------------- Date helpers ----------------
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function localDateKey(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function timeLabel(iso) {
    const d = new Date(iso);
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  function dateHeaderLabel(key) {
    const p = key.split("-");
    const d = new Date(+p[0], +p[1] - 1, +p[2]);
    const dow = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
    return p[0] + "年" + (+p[1]) + "月" + (+p[2]) + "日 (" + dow + ")";
  }

  // ---------------- small math helpers ----------------
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function newCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
  function cleanText(t) { return (t || "").replace(/\n{3,}/g, "\n\n").trim(); }

  // Full-width -> half-width ASCII normalization for 日本語 mode output. The
  // user stores model numbers and addresses, so full-width digits/letters that
  // the jpn LSTM sometimes emits (０-９Ａ-Ｚａ-ｚ, full-width hyphen －, ideographic
  // space) are folded to their ASCII equivalents; various Unicode dash/minus
  // glyphs are folded to "-" so an address like 東京都千代田区1-2-3 or a code
  // like KX-1234 reads back in plain ASCII. The katakana chōonpu ー (U+30FC) is
  // deliberately NOT in any of these ranges, so real kana is left intact.
  function normalizeWidth(t) {
    if (!t) return t;
    return t
      .replace(/[！-～]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
      .replace(/　/g, " ")
      .replace(/[‐-―−⁃﹘﹣]/g, "-");
  }

  // Rebuild recognized text keeping only words with confidence >= 35,
  // preserving line breaks (tesseract.js v5: data.lines[].words[].confidence,
  // both 0..100 scales, verified at runtime). Returns null (not "") when the
  // result has no structured .lines to filter, so the caller can fall back
  // to the raw text; a real empty-after-filtering result stays "".
  function filterLowConfWords(data) {
    if (!data || !Array.isArray(data.lines) || !data.lines.length) return null;
    const outLines = [];
    for (const line of data.lines) {
      const words = Array.isArray(line && line.words) ? line.words : [];
      const kept = words
        .filter((w) => w && typeof w.text === "string" && w.text.trim() &&
          (typeof w.confidence !== "number" || w.confidence >= 35))
        .map((w) => w.text);
      if (kept.length) outLines.push(kept.join(" "));
    }
    return outLines.join("\n");
  }

  // ---------------- Word filter (単語フィルタ): hybrid dictionary + pattern
  // token classifier ----------------
  // Cert-mark logos (PSE, circled (R), circled seal marks, etc.) get misread
  // as stray symbols / isolated CJK characters / short nonsense tokens. A
  // *pure* dictionary filter would also delete the app's whole point --
  // model/serial numbers like "KX-1234AB" or "5X-98765" are not English
  // words -- so a token survives if it EITHER is a real English word OR
  // structurally looks like a model number / unit / known label
  // abbreviation. Symbol-noise Unicode ranges are stripped outright, and an
  // isolated single CJK character (the typical enclosure misread) is
  // dropped unless it's recognizable label vocabulary via a small embedded
  // lexicon.

  // Lazy-loaded, module-level cache: fetch word-list's words.txt on first
  // use, split/lowercase into a Set. If the fetch fails, the filter still
  // works in pattern-only mode (dictionary checks simply return false); no
  // user-facing error, console.warn only.
  let wordSet = null;
  let wordSetFailed = false;
  let wordSetPromise = null;
  async function getWordSet(onStatus) {
    if (wordSet) return wordSet;
    if (wordSetFailed) return null;
    if (wordSetPromise) return wordSetPromise;
    wordSetPromise = (async () => {
      try {
        if (onStatus) onStatus("辞書を読み込み中…", 0.92);
        const res = await fetch(WORD_LIST_URL);
        if (!res.ok) throw new Error("word-list fetch failed: " + res.status);
        const txt = await res.text();
        const set = new Set();
        for (const w of txt.split("\n")) {
          const t = w.trim().toLowerCase();
          if (t) set.add(t);
        }
        wordSet = set;
        return wordSet;
      } catch (e) {
        console.warn("Word list unavailable, filter running in pattern-only mode:", e);
        wordSetFailed = true;
        return null;
      } finally {
        wordSetPromise = null;
      }
    })();
    return wordSetPromise;
  }

  // Symbol noise: Unicode blocks that circled/boxed cert-mark misreads land
  // in (enclosed alphanumerics, enclosed/compat CJK, letterlike symbols,
  // geometric shapes, misc symbols & dingbats), plus a handful of common
  // mark characters that fall outside those blocks.
  const SYMBOL_NOISE_RE = /[①-⓿㈀-㋿㌀-㏿℀-⅏■-◿☀-➿©®™§※]/g;

  // CJK character ranges used for run-splitting: Hiragana, Katakana, CJK
  // Unified Ideographs (+ Ext-A), halfwidth Katakana.
  const CJK_RANGES = "\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uFF66-\\uFF9D";
  const CJK_CHAR_RE = new RegExp("^[" + CJK_RANGES + "]$");
  const CJK_SPACE_RE = new RegExp("([" + CJK_RANGES + "])\\s+(?=[" + CJK_RANGES + "])", "g");
  const CJK_SEGMENT_RE = new RegExp("[" + CJK_RANGES + "]+|[^" + CJK_RANGES + "]+", "g");
  function isCjkChar(ch) { return CJK_CHAR_RE.test(ch); }

  // Small embedded lexicon of Japanese appliance/label vocabulary. Lets a
  // short (even 2-char) CJK run survive as label text; an isolated single
  // kanji/kana (the typical enclosure misread) is still dropped by the
  // run-length >= 2 rule in filterLine below.
  const LABEL_LEXICON = [
    "型番", "品番", "型式", "形名", "製造番号", "製番", "号機",
    "製造年月", "製造年", "製造月", "製品名", "商品名", "品名",
    "定格", "定格電圧", "定格電流", "定格周波数", "定格出力",
    "電圧", "電流", "周波数", "消費電力", "出力", "入力",
    "容量", "質量", "重量", "寸法", "外形寸法",
    "電源", "電池", "単相", "三相", "交流", "直流",
    "株式会社", "有限会社", "合同会社",
    "製造元", "販売元", "発売元", "輸入元",
    "日本製", "中国製", "韓国製", "台湾製", "米国製",
    "原産国", "生産国",
    "取扱説明書", "取扱注意", "使用上の注意",
    "注意", "警告", "危険", "禁止",
    "保証書", "保証期間", "修理", "故障",
    "検査", "検査合格", "合格", "認証", "認定", "適合", "適合品",
    "安全", "安全基準", "規格", "準拠",
    "環境", "廃棄", "リサイクル", "分別",
    "材質", "樹脂", "金属",
    "部品番号", "部品名", "図番", "図番号",
    "仕様", "仕様書", "版数", "改訂", "改訂版"
  ];
  const LABEL_LEXICON_SET = new Set(LABEL_LEXICON);
  function cjkRunIsLexical(run) {
    if (LABEL_LEXICON_SET.has(run)) return true;
    for (const entry of LABEL_LEXICON) if (run.indexOf(entry) >= 0) return true;
    return false;
  }

  // ASCII token pattern rules.
  const MODEL_LIKE_RE = /^[A-Za-z0-9][A-Za-z0-9\-\/.:#+]*$/;
  const UNIT_RE = /^\d+(\.\d+)?(V|W|A|VA|Hz|kHz|mA|Ah|kg|g|L|mm|cm|°C)\.?$/i;
  const LABEL_ABBR = new Set([
    "MODEL", "MODELE", "TYPE", "SN", "S/N", "P/N", "NO", "NO.",
    "LOT", "REF", "AC", "DC", "PSE", "CE", "FCC", "MADE", "IN"
  ]);
  const TRAILING_PUNCT_RE = /[.,;:!?)"'\]]+$/;

  function isKeepAsciiToken(tok, dictSet, lineDigitCount) {
    if (!tok) return false;
    const stripped = tok.replace(TRAILING_PUNCT_RE, "");
    // EAN/UPC leading-digit exception: a barcode's human-readable digits are
    // conventionally printed as a lone leading digit plus two 6-digit groups
    // (e.g. "4 901234 567894"), so a single stray digit is otherwise
    // indistinguishable from cert-mark noise UNLESS its line clearly is a
    // barcode digit string (>= 6 digits total across the line). Deliberately
    // narrow: this does not otherwise relax the general length>=2 rule.
    if (/^\d$/.test(stripped) && lineDigitCount >= 6) return true;
    if (stripped.length >= 2 && dictSet && dictSet.has(stripped.toLowerCase())) return true;
    if (MODEL_LIKE_RE.test(tok) && /\d/.test(tok) && tok.length >= 2) return true;
    if (UNIT_RE.test(tok)) return true;
    if (LABEL_ABBR.has(stripped.toUpperCase())) return true;
    return false;
  }

  // Apply the hybrid classifier to one line: strip symbol noise, collapse
  // whitespace between CJK characters, then keep/drop each CJK run or ASCII
  // token per the rules above. Returns "" if nothing in the line survives.
  function filterLine(line, dictSet) {
    const lineDigitCount = (line.match(/\d/g) || []).length;
    let s = line.replace(SYMBOL_NOISE_RE, "");
    s = s.replace(CJK_SPACE_RE, "$1");
    const segments = s.match(CJK_SEGMENT_RE) || [];
    const kept = [];
    for (const seg of segments) {
      if (!seg) continue;
      if (isCjkChar(seg[0])) {
        if (seg.length >= 2 || cjkRunIsLexical(seg)) kept.push(seg);
      } else {
        const toks = seg.split(/\s+/).filter(Boolean);
        for (const t of toks) if (isKeepAsciiToken(t, dictSet, lineDigitCount)) kept.push(t);
      }
    }
    return kept.join(" ");
  }

  // Pure function: apply filterLine per line, preserving line order, drop
  // lines that end up empty. dictSet may be null (pattern-only mode).
  function filterTokens(text, dictSet) {
    if (!text) return "";
    const outLines = [];
    for (const line of text.split("\n")) {
      const f = filterLine(line, dictSet);
      if (f) outLines.push(f);
    }
    return outLines.join("\n");
  }

  // ---------------- Image loading (EXIF-aware) ----------------
  async function loadBitmap(blob) {
    if (typeof createImageBitmap === "function") {
      try { return await createImageBitmap(blob, { imageOrientation: "from-image" }); }
      catch (e) { /* fall back below */ }
      try { return await createImageBitmap(blob); }
      catch (e) { /* fall back below */ }
    }
    return await new Promise((res, rej) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("画像の読み込みに失敗しました")); };
      img.src = url;
    });
  }
  function dims(src) {
    return { w: src.width || src.naturalWidth, h: src.height || src.naturalHeight };
  }

  // Draw source into a canvas scaled so the longest side <= maxSide.
  function drawScaled(src, maxSide) {
    const { w, h } = dims(src);
    const scale = Math.min(1, maxSide / Math.max(w, h));
    const cw = Math.max(1, Math.round(w * scale));
    const ch = Math.max(1, Math.round(h * scale));
    const c = newCanvas(cw, ch);
    const ctx = c.getContext("2d");
    ctx.drawImage(src, 0, 0, cw, ch);
    return c;
  }

  // Full-image preprocess for the Tesseract path: downscale, grayscale,
  // percentile contrast stretch. (Cropped regions use preprocessCrop below.)
  function preprocess(src) {
    const c = drawScaled(src, 1600);
    const ctx = c.getContext("2d");
    const img = ctx.getImageData(0, 0, c.width, c.height);
    const d = img.data;
    const n = d.length / 4;
    const gray = new Uint8ClampedArray(n);
    const hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) {
      const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
      const y = (r * 0.299 + g * 0.587 + b * 0.114) | 0;
      gray[i] = y; hist[y]++;
    }
    const lowCut = n * 0.02, highCut = n * 0.98;
    let acc = 0, lo = 0, hi = 255;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= lowCut) { lo = v; break; } }
    acc = 0;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= highCut) { hi = v; break; } }
    if (hi <= lo) { lo = 0; hi = 255; }
    const range = hi - lo;
    for (let i = 0; i < n; i++) {
      let v = (gray[i] - lo) * 255 / range;
      v = v < 0 ? 0 : v > 255 ? 255 : v;
      d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v;
      d[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }

  // Adaptive mean threshold via a summed-area table (integral image): for
  // each pixel, compare it against its local window mean +/- C. Robust to
  // uneven lighting / glossy-label glare that a single global Otsu threshold
  // leaves as background blotches (phantom "ink"). Polarity (dark text on
  // light background vs. the reverse) is still decided by the caller via a
  // single global statistic (Otsu dark-ratio) -- that's a property of the
  // whole crop, not of any one neighborhood.
  function adaptiveThreshold(gray, cw, ch, win, C, textIsDark) {
    const half = win >> 1;
    const integral = new Float64Array((cw + 1) * (ch + 1));
    for (let y = 0; y < ch; y++) {
      let rowSum = 0;
      const rowBase = y * cw;
      const iRow = (y + 1) * (cw + 1);
      const iRowPrev = y * (cw + 1);
      for (let x = 0; x < cw; x++) {
        rowSum += gray[rowBase + x];
        integral[iRow + x + 1] = integral[iRowPrev + x + 1] + rowSum;
      }
    }
    const mask = new Uint8Array(cw * ch); // 1 = ink, 0 = background
    for (let y = 0; y < ch; y++) {
      const y0 = y - half < 0 ? 0 : y - half, y1 = y + half >= ch ? ch - 1 : y + half;
      for (let x = 0; x < cw; x++) {
        const x0 = x - half < 0 ? 0 : x - half, x1 = x + half >= cw ? cw - 1 : x + half;
        const area = (x1 - x0 + 1) * (y1 - y0 + 1);
        const sum = integral[(y1 + 1) * (cw + 1) + (x1 + 1)]
                  - integral[y0 * (cw + 1) + (x1 + 1)]
                  - integral[(y1 + 1) * (cw + 1) + x0]
                  + integral[y0 * (cw + 1) + x0];
        const mean = sum / area;
        const v = gray[y * cw + x];
        const ink = textIsDark ? (v < mean - C) : (v > mean + C);
        mask[y * cw + x] = ink ? 1 : 0;
      }
    }
    return mask;
  }

  // Remove small connected components of "ink" (area < minArea) from a
  // 0/1 mask via iterative (stack-based) flood fill / 4-connectivity
  // labeling. Bounded: crops are capped at ~2000px on the long side.
  function despeckle(mask, cw, ch, minArea) {
    const n = cw * ch;
    const visited = new Uint8Array(n);
    const stack = new Int32Array(n);
    for (let start = 0; start < n; start++) {
      if (!mask[start] || visited[start]) continue;
      let sp = 0;
      stack[sp++] = start; visited[start] = 1;
      const comp = [start];
      while (sp > 0) {
        const idx = stack[--sp];
        const x = idx % cw, y = (idx / cw) | 0;
        if (x > 0) { const m = idx - 1; if (mask[m] && !visited[m]) { visited[m] = 1; stack[sp++] = m; comp.push(m); } }
        if (x < cw - 1) { const m = idx + 1; if (mask[m] && !visited[m]) { visited[m] = 1; stack[sp++] = m; comp.push(m); } }
        if (y > 0) { const m = idx - cw; if (mask[m] && !visited[m]) { visited[m] = 1; stack[sp++] = m; comp.push(m); } }
        if (y < ch - 1) { const m = idx + cw; if (mask[m] && !visited[m]) { visited[m] = 1; stack[sp++] = m; comp.push(m); } }
      }
      if (comp.length < minArea) { for (const idx of comp) mask[idx] = 0; }
    }
  }

  function otsuThreshold(hist, total) {
    let sum = 0;
    for (let i = 0; i < 256; i++) sum += i * hist[i];
    let sumB = 0, wB = 0, max = 0, thr = 0;
    for (let i = 0; i < 256; i++) {
      wB += hist[i]; if (wB === 0) continue;
      const wF = total - wB; if (wF === 0) break;
      sumB += i * hist[i];
      const mB = sumB / wB, mF = (sum - sumB) / wF;
      const between = wB * wF * (mB - mF) * (mB - mF);
      if (between > max) { max = between; thr = i; }
    }
    return thr;
  }

  // Locate horizontal text bands in an image via a projection profile.
  // Returns [{y0,y1}] in the source's own pixel coordinates. Used both to
  // split the crop into single lines (Paddle) and to pick Tesseract PSM.
  function findTextBands(src) {
    const { w, h } = dims(src);
    const scale = Math.min(1, 1000 / Math.max(w, h));
    const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    const c = newCanvas(cw, ch);
    c.getContext("2d").drawImage(src, 0, 0, cw, ch);
    const d = c.getContext("2d").getImageData(0, 0, cw, ch).data;
    const n = cw * ch;
    const gray = new Uint8Array(n);
    const hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) {
      const y = (d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114) | 0;
      gray[i] = y; hist[y]++;
    }
    const t = otsuThreshold(hist, n);
    let dark = 0;
    for (let i = 0; i < n; i++) if (gray[i] < t) dark++;
    const textIsDark = dark <= n - dark; // text is usually the minority class
    const rowInk = new Uint32Array(ch);
    for (let y = 0; y < ch; y++) {
      let cnt = 0; const base = y * cw;
      for (let x = 0; x < cw; x++) {
        const isDark = gray[base + x] < t;
        if (textIsDark ? isDark : !isDark) cnt++;
      }
      rowInk[y] = cnt;
    }
    let maxInk = 0;
    for (let y = 0; y < ch; y++) if (rowInk[y] > maxInk) maxInk = rowInk[y];
    if (maxInk === 0) return [{ y0: 0, y1: h }];
    const gapAllow = Math.max(2, Math.round(ch * 0.02));
    const absFloor = Math.max(1, cw * 0.03);
    // Barcode robustness: an ultra-dense stripe block (e.g. a barcode) can
    // have rows far inkier than any real text line. If that single row were
    // allowed to set the relative bar below (12% of the strongest row), a
    // much sparser but still-legitimate text row right next to it -- e.g.
    // the human-readable digits printed under a barcode -- would fall below
    // the bar and never become its own band, silently dropping real text.
    // Fix: instead of the single strongest row in the whole image, use the
    // WEAKEST peak among the distinct row-ink "blocks" found via a loose
    // absolute floor -- i.e. let the sparsest plausible content block (not
    // the densest one) set the bar, so one dense block can't starve a
    // fainter block elsewhere. Blocks that never clear today's absolute
    // floor on their own (pure speckle) are excluded so they can't drag the
    // bar down to noise level. Falls back to maxInk (today's behavior) when
    // there's only one qualifying block (e.g. no barcode present).
    const looseFloor = Math.max(1, cw * 0.01);
    const blockPeaks = [];
    {
      let bStart = -1, bPeak = 0, bGap = 0;
      for (let y = 0; y < ch; y++) {
        if (rowInk[y] > looseFloor) {
          if (bStart < 0) { bStart = y; bPeak = 0; }
          if (rowInk[y] > bPeak) bPeak = rowInk[y];
          bGap = 0;
        } else if (bStart >= 0) {
          bGap++;
          if (bGap > gapAllow) {
            if (bPeak >= absFloor) blockPeaks.push(bPeak);
            bStart = -1; bPeak = 0; bGap = 0;
          }
        }
      }
      if (bStart >= 0 && bPeak >= absFloor) blockPeaks.push(bPeak);
    }
    const refInk = blockPeaks.length ? Math.min(...blockPeaks) : maxInk;
    // A row only counts as textual if it clears BOTH a relative bar (12% of
    // refInk) AND an absolute one (3% of the row width) -- the absolute
    // floor is what keeps noise-only crops (where refInk is itself just
    // speckle) from producing bands.
    const thr = Math.max(1, refInk * 0.12, absFloor);
    const raw = [];
    let start = -1, gap = 0;
    for (let y = 0; y < ch; y++) {
      if (rowInk[y] > thr) { if (start < 0) start = y; gap = 0; }
      else if (start >= 0) { gap++; if (gap > gapAllow) { raw.push([start, y - gap]); start = -1; gap = 0; } }
    }
    if (start >= 0) raw.push([start, ch - 1]);
    const out = [];
    const inv = 1 / scale;
    const minH = Math.max(6, ch * 0.02); // band height >= 6px at analysis scale
    for (const seg of raw) {
      const a = seg[0], b = seg[1];
      if (b - a < minH) continue;
      const pad = Math.round((b - a) * 0.25) + 2;
      const y0 = Math.max(0, a - pad), y1 = Math.min(ch - 1, b + pad);
      out.push({ y0: Math.round(y0 * inv), y1: Math.round((y1 + 1) * inv) });
    }
    return out.length ? out : [{ y0: 0, y1: h }];
  }

  // Cropped-region preprocess for Tesseract: upscale small crops so text is
  // legible, grayscale, percentile stretch, Otsu binarize with polarity
  // detection (invert white-on-dark). Returns {canvas, singleLine}.
  function preprocessCrop(src) {
    const bands = findTextBands(src);
    const { w, h } = dims(src);
    const short = Math.min(w, h), long = Math.max(w, h);
    let f = 1;
    if (short < 300) f = Math.min(3, Math.max(2, Math.ceil(300 / short)));
    if (long * f > 2000) f = Math.max(1, 2000 / long);
    const cw = Math.max(1, Math.round(w * f)), ch = Math.max(1, Math.round(h * f));
    const c = newCanvas(cw, ch);
    const ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(src, 0, 0, cw, ch);
    const img = ctx.getImageData(0, 0, cw, ch);
    const d = img.data; const n = cw * ch;
    const gray = new Uint8ClampedArray(n);
    const hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) {
      const y = (d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114) | 0;
      gray[i] = y; hist[y]++;
    }
    const lowCut = n * 0.02, highCut = n * 0.98;
    let acc = 0, lo = 0, hi = 255;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= lowCut) { lo = v; break; } }
    acc = 0;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= highCut) { hi = v; break; } }
    if (hi <= lo) { lo = 0; hi = 255; }
    const range = hi - lo;
    const hist2 = new Uint32Array(256);
    for (let i = 0; i < n; i++) {
      let v = (gray[i] - lo) * 255 / range;
      v = v < 0 ? 0 : v > 255 ? 255 : v; v = v | 0;
      gray[i] = v; hist2[v]++;
    }
    // Polarity (dark-text-on-light vs. light-text-on-dark) is a property of
    // the whole crop, so it's still decided from one global statistic: Otsu
    // dark-ratio (text is the minority class).
    const t = otsuThreshold(hist2, n);
    let dark = 0;
    for (let i = 0; i < n; i++) if (gray[i] < t) dark++;
    const textIsDark = dark <= n - dark;

    // Local adaptive mean threshold instead of a single global cut: uneven
    // lighting / glossy labels leave background blotches under global Otsu,
    // which read as phantom characters. Window ~ shorter-side/8 (odd, >=15).
    const win = (() => {
      const w0 = Math.max(15, Math.round(Math.min(cw, ch) / 8));
      return w0 % 2 === 0 ? w0 + 1 : w0;
    })();
    const C = 10;
    const mask = adaptiveThreshold(gray, cw, ch, win, C, textIsDark);

    // Despeckle: drop small connected "ink" components (noise specks) left
    // over after binarization -- isolated pixels are removed by the same
    // area filter since a lone pixel is a 1-pixel component.
    const despeckleMin = Math.max(4, Math.round((ch / 60) * (ch / 60)));
    despeckle(mask, cw, ch, despeckleMin);

    for (let i = 0; i < n; i++) {
      const val = mask[i] ? 0 : 255;
      d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = val; d[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return { canvas: c, singleLine: bands.length <= 1 };
  }

  // Extract the on-screen crop rectangle (fractions 0..1) as original-image pixels.
  function cropFromBitmap(bmp, r) {
    const { w, h } = dims(bmp);
    let sx = Math.round(r.x * w), sy = Math.round(r.y * h);
    let sw = Math.round(r.w * w), sh = Math.round(r.h * h);
    sx = clamp(sx, 0, w - 1); sy = clamp(sy, 0, h - 1);
    sw = clamp(sw, 1, w - sx); sh = clamp(sh, 1, h - sy);
    const c = newCanvas(sw, sh);
    c.getContext("2d").drawImage(bmp, sx, sy, sw, sh, 0, 0, sw, sh);
    return c;
  }

  // Reasonably sized JPEG data URL for storage / preview.
  function toStorageDataUrl(src) {
    return drawScaled(src, 800).toDataURL("image/jpeg", 0.7);
  }

  // ---------------- Tesseract worker ----------------
  // At most one live worker at a time (iPhone memory). It is cached and
  // reused while its mode stays the active mode; switching mode terminates
  // the previous worker before creating the new one, on the next OCR run.
  let tessWorker = null;
  let tessWorkerMode = null;
  async function getWorker(mode, onLog) {
    if (tessWorker && tessWorkerMode === mode) return tessWorker;
    if (tessWorker) {
      const old = tessWorker;
      tessWorker = null; tessWorkerMode = null;
      try { await old.terminate(); } catch (e) { /* ignore */ }
    }
    if (typeof Tesseract === "undefined") throw new Error("OCRエンジンの読み込みに失敗しました");
    const cfg = TESS_LANGS[mode] || TESS_LANGS.eng;
    tessWorker = await Tesseract.createWorker(cfg.lang, 1 /* OEM.LSTM_ONLY */, {
      workerPath: TESS.workerPath,
      corePath: TESS.corePath,
      langPath: cfg.langPath,
      logger: onLog
    });
    tessWorkerMode = mode;
    return tessWorker;
  }
  async function releaseTessWorker() {
    if (!tessWorker) return;
    const old = tessWorker; tessWorker = null; tessWorkerMode = null;
    try { await old.terminate(); } catch (e) { /* ignore */ }
  }
  function mapStatus(s) {
    if (!s) return "処理中…";
    if (s.indexOf("core") >= 0) return "エンジンを読み込み中…";
    if (s.indexOf("lang") >= 0 || s.indexOf("traineddata") >= 0) return "言語データを読み込み中…";
    if (s.indexOf("initializ") >= 0) return "初期化中…";
    if (s.indexOf("recognizing") >= 0) return "認識中…";
    if (s.indexOf("loading") >= 0) return "読み込み中…";
    return "処理中…";
  }

  // ---------------- PaddleOCR (onnxruntime-web, rec-only) ----------------
  let ortScriptPromise = null;
  function loadOrt() {
    if (window.ort) return Promise.resolve(window.ort);
    if (ortScriptPromise) return ortScriptPromise;
    ortScriptPromise = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = ORT.script; s.async = true;
      s.onload = () => { window.ort ? res(window.ort) : rej(new Error("onnxruntime-web の初期化に失敗しました")); };
      s.onerror = () => { ortScriptPromise = null; rej(new Error("onnxruntime-web の読み込みに失敗しました")); };
      document.head.appendChild(s);
    });
    return ortScriptPromise;
  }

  let paddleSession = null;
  let paddleDict = null;
  let paddleLoading = null;
  async function getPaddle(onStatus) {
    if (paddleSession && paddleDict) return { session: paddleSession, dict: paddleDict };
    if (paddleLoading) return paddleLoading;
    paddleLoading = (async () => {
      if (onStatus) onStatus("OCRエンジンを準備中…", 0.2);
      const ort = await loadOrt();
      ort.env.wasm.numThreads = 1;      // GitHub Pages: no COOP/COEP -> no SharedArrayBuffer
      ort.env.wasm.proxy = false;       // no proxy worker (keeps CSP simple)
      ort.env.wasm.simd = true;
      ort.env.wasm.wasmPaths = ORT.wasmDir;
      if (onStatus) onStatus("モデルを読み込み中…", 0.45);
      const [session, dictText] = await Promise.all([
        ort.InferenceSession.create(PADDLE.rec, { executionProviders: ["wasm"], graphOptimizationLevel: "all" }),
        fetch(PADDLE.dict).then((r) => { if (!r.ok) throw new Error("辞書ファイルの取得に失敗しました"); return r.text(); })
      ]);
      paddleSession = session;
      // PaddleOCR CTCLabelDecode: index 0 = blank, indices 1..N map to dict[i-1];
      // dict = each line of ppocr_keys_v1.txt plus a trailing space char.
      // A trailing newline in the file must not become an extra empty entry,
      // or the space char (and nothing else) would decode to "".
      const lines = dictText.split("\n");
      while (lines.length && lines[lines.length - 1] === "") lines.pop();
      paddleDict = [...lines, " "];
      return { session: paddleSession, dict: paddleDict };
    })();
    try { return await paddleLoading; }
    finally { paddleLoading = null; }
  }
  function releasePaddle() {
    if (paddleSession) {
      try { if (paddleSession.release) paddleSession.release(); } catch (e) { /* ignore */ }
      paddleSession = null;
    }
  }

  function lineCanvasFrom(src, band) {
    const { w, h } = dims(src);
    const y0 = clamp(band.y0 | 0, 0, h - 1);
    const y1 = clamp(band.y1 | 0, y0 + 1, h);
    const bh = Math.max(1, y1 - y0);
    const c = newCanvas(w, bh);
    c.getContext("2d").drawImage(src, 0, y0, w, bh, 0, 0, w, bh);
    return c;
  }

  // Word-level segmentation within one already-line-banded canvas: build a
  // column ink profile (grayscale + Otsu, same polarity logic as
  // findTextBands) and split on runs of empty columns wide enough to be
  // inter-word whitespace rather than intra-word letter spacing -- "as if a
  // human had drawn a box around each word". This is what lets
  // paddleRecognize (a) reject just a failing word (e.g. a barcode-stripe
  // segment next to real digits) instead of the whole line, and (b) recover
  // multi-word lines the CTC decoder doesn't reliably print a space within
  // (e.g. "MADE IN JAPAN" -> "MADEINJAPAN" on this rec model).
  //
  // Returns null when segmentation should be skipped and the caller should
  // run the whole line through recOne unchanged (today's behavior): either
  // only one ink block was found (nothing to split), or more than
  // WORD_MAX_SEGMENTS blocks were found (almost certainly a barcode or
  // texture, not real words -- let the whole-line score gate judge it
  // instead of paying for dozens of recOne calls).
  // Otherwise returns [{x0,x1,y0,y1}, ...] word boxes in the input canvas's
  // own pixel coordinates, y-tightened to each word's own ink rows (plus
  // ~15% padding all around, clamped to the canvas).
  const WORD_GAP_HEIGHT_RATIO = 0.45;
  const WORD_MAX_SEGMENTS = 24;
  function segmentWordsInLine(lineCanvas) {
    const { w: lw, h: lh } = dims(lineCanvas);
    const scale = Math.min(1, 1400 / lw);
    const aw = Math.max(1, Math.round(lw * scale)), ah = Math.max(1, Math.round(lh * scale));
    const ac = newCanvas(aw, ah);
    ac.getContext("2d").drawImage(lineCanvas, 0, 0, aw, ah);
    const d = ac.getContext("2d").getImageData(0, 0, aw, ah).data;
    const n = aw * ah;
    const gray = new Uint8Array(n);
    const hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) {
      const y = (d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114) | 0;
      gray[i] = y; hist[y]++;
    }
    const t = otsuThreshold(hist, n);
    let dark = 0;
    for (let i = 0; i < n; i++) if (gray[i] < t) dark++;
    const textIsDark = dark <= n - dark;
    const colInk = new Uint32Array(aw);
    for (let x = 0; x < aw; x++) {
      let cnt = 0;
      for (let y = 0; y < ah; y++) {
        const isDark = gray[y * aw + x] < t;
        if (textIsDark ? isDark : !isDark) cnt++;
      }
      colInk[x] = cnt;
    }
    let maxCol = 0;
    for (let x = 0; x < aw; x++) if (colInk[x] > maxCol) maxCol = colInk[x];
    if (maxCol === 0) return null;

    const emptyFloor = Math.max(0, Math.round(maxCol * 0.05));
    const gapThreshold = Math.max(3, Math.round(ah * WORD_GAP_HEIGHT_RATIO));

    // Column run-length split: a run of empty columns >= gapThreshold starts
    // a new word segment; shorter gaps (letter spacing within a word) don't.
    const rawSegs = [];
    let segStart = -1, gapStart = -1, gapLen = 0;
    for (let x = 0; x < aw; x++) {
      const empty = colInk[x] <= emptyFloor;
      if (!empty) {
        if (segStart < 0) segStart = x;
        gapStart = -1; gapLen = 0;
      } else if (segStart >= 0) {
        if (gapStart < 0) gapStart = x;
        gapLen++;
        if (gapLen >= gapThreshold) {
          rawSegs.push([segStart, gapStart]);
          segStart = -1; gapStart = -1; gapLen = 0;
        }
      }
    }
    if (segStart >= 0) rawSegs.push([segStart, aw]);
    if (rawSegs.length <= 1 || rawSegs.length > WORD_MAX_SEGMENTS) return null;

    const inv = 1 / scale;
    const out = [];
    for (const [sx, ex] of rawSegs) {
      // Tighten the y-extent to this segment's own ink rows.
      let y0 = -1, y1 = -1;
      for (let y = 0; y < ah; y++) {
        let hasInk = false;
        for (let x = sx; x < ex; x++) {
          const isDark = gray[y * aw + x] < t;
          if (textIsDark ? isDark : !isDark) { hasInk = true; break; }
        }
        if (hasInk) { if (y0 < 0) y0 = y; y1 = y; }
      }
      if (y0 < 0) continue; // shouldn't happen (segment came from a nonzero colInk range)
      const segW = ex - sx, segH = y1 - y0 + 1;
      const padX = Math.max(1, Math.round(segW * 0.15));
      const padY = Math.max(1, Math.round(segH * 0.15));
      const ax0 = Math.max(0, sx - padX), ax1 = Math.min(aw, ex + padX);
      const ay0 = Math.max(0, y0 - padY), ay1 = Math.min(ah, y1 + 1 + padY);
      out.push({
        x0: clamp(Math.round(ax0 * inv), 0, lw - 1),
        x1: clamp(Math.round(ax1 * inv), 1, lw),
        y0: clamp(Math.round(ay0 * inv), 0, lh - 1),
        y1: clamp(Math.round(ay1 * inv), 1, lh)
      });
    }
    return out.length > 1 ? out : null;
  }

  // Resize a single-line image to height 48 (proportional width), build the
  // BGR CHW float tensor, run rec, CTC-greedy decode.
  // Returns { text, score }: score is the mean of the argmax probabilities
  // over the EMITTED steps only (non-blank, non-repeat) -- the same
  // definition PaddleOCR's own CTCLabelDecode uses to compute its confidence,
  // which upstream then thresholds at 0.5 to drop garbage. The rec model's
  // output is already post-softmax per timestep (each row sums to ~1, values
  // in [0,1] -- verified empirically by probing the ONNX output directly),
  // so the argmax values can be used as probabilities with no extra softmax.
  async function recOne(ort, session, dict, lineCanvas) {
    let w = Math.round(lineCanvas.width * REC_H / lineCanvas.height);
    w = clamp(w, 16, 2000);
    const c = newCanvas(w, REC_H);
    const ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(lineCanvas, 0, 0, w, REC_H);
    const d = ctx.getImageData(0, 0, w, REC_H).data;
    const n = w * REC_H;
    const input = new Float32Array(3 * n);
    for (let i = 0; i < n; i++) {
      const r = d[i * 4] / 255, g = d[i * 4 + 1] / 255, b = d[i * 4 + 2] / 255;
      input[i] = (b - 0.5) / 0.5;         // B plane
      input[n + i] = (g - 0.5) / 0.5;     // G plane
      input[2 * n + i] = (r - 0.5) / 0.5; // R plane
    }
    const tensor = new ort.Tensor("float32", input, [1, 3, REC_H, w]);
    const feeds = {}; feeds[session.inputNames[0]] = tensor;
    const out = await session.run(feeds);
    const o = out[session.outputNames[0]];
    const T = o.dims[1], C = o.dims[2], data = o.data;
    let prev = -1, s = "";
    let scoreSum = 0, scoreCount = 0;
    for (let t = 0; t < T; t++) {
      const base = t * C;
      let best = data[base], bi = 0;
      for (let ci = 1; ci < C; ci++) { const v = data[base + ci]; if (v > best) { best = v; bi = ci; } }
      if (bi !== 0 && bi !== prev) {
        const ch = dict[bi - 1];
        if (ch !== undefined) { s += ch; scoreSum += best; scoreCount++; }
      }
      prev = bi;
    }
    return { text: s.trim(), score: scoreCount ? scoreSum / scoreCount : 0 };
  }

  // Crop a sub-region (in a canvas's own pixel coordinates) into a new canvas.
  function subCanvas(src, box) {
    const w = Math.max(1, box.x1 - box.x0), h = Math.max(1, box.y1 - box.y0);
    const c = newCanvas(w, h);
    c.getContext("2d").drawImage(src, box.x0, box.y0, w, h, 0, 0, w, h);
    return c;
  }

  // PaddleOCR CTC decode has no built-in confidence rejection in this
  // rec-only setup, but upstream PaddleOCR drops results with score < 0.5;
  // do the same here so noise-only bands (fed in by findTextBands on crops
  // with no real text) don't surface hallucinated characters. Also: the
  // ch(+ASCII) dictionary hallucinates CJK glyphs on pure noise, and this
  // path (paddleRecognize) is only ever used in 英数字 mode (see runOcr),
  // so stripping non-ASCII here is a safe, always-applicable post-filter.
  //
  // Each line band is further split into per-word sub-images by
  // segmentWordsInLine (see there) -- "as if a human had drawn a box around
  // each word" -- and each word is recognized and confidence-gated
  // independently. This is what lets a single failing word (e.g. a barcode
  // stripe segment mis-banded next to real digits) get dropped WITHOUT
  // taking the rest of the line down with it, and lets multi-word lines
  // survive even when the CTC decoder doesn't reliably emit a space between
  // words on this input. When segmentWordsInLine finds nothing to split
  // (one block, or too many to plausibly be words), the band is recognized
  // whole exactly as before.
  async function paddleRecognize(cropCanvas, onStatus) {
    const { session, dict } = await getPaddle(onStatus);
    const ort = window.ort;
    if (onStatus) onStatus("認識中…", 0.85);
    const bands = findTextBands(cropCanvas);
    const kept = [];
    for (let i = 0; i < bands.length; i++) {
      const lc = lineCanvasFrom(cropCanvas, bands[i]);
      const wordBoxes = segmentWordsInLine(lc);
      const wordResults = [];
      if (!wordBoxes) {
        wordResults.push(await recOne(ort, session, dict, lc));
      } else {
        for (const box of wordBoxes) {
          wordResults.push(await recOne(ort, session, dict, subCanvas(lc, box)));
        }
      }
      const keptWords = [];
      for (const { text, score } of wordResults) {
        if (!text || score < 0.5) continue;
        const ascii = text.replace(/[^\x00-\x7F]/g, "").replace(/[ \t]+/g, " ").trim();
        if (!ascii) continue;
        keptWords.push({ text: ascii, score });
      }
      if (!keptWords.length) continue;
      const lineScore = keptWords.reduce((a, k) => a + k.score, 0) / keptWords.length;
      kept.push({ text: keptWords.map((k) => k.text).join(" "), score: lineScore });
    }
    if (onStatus) onStatus("完了", 1);
    if (!kept.length) return { text: "", score: null };
    const meanScore = kept.reduce((a, k) => a + k.score, 0) / kept.length;
    return { text: kept.map((k) => k.text).join("\n"), score: meanScore };
  }

  // ---------------- Clipboard helpers ----------------
  async function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall through */ }
    }
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  // ========================================================
  const App = {
    setup() {
      const view = ref("capture");          // 'capture' | 'list'
      const toast = ref("");
      let toastTimer = null;
      function showToast(msg) {
        toast.value = msg;
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.value = ""; }, 1800);
      }

      // ---- capture state ----
      const ocrMode = ref((() => {
        try { return localStorage.getItem(LANG_MODE_KEY) === "jpn" ? "jpn" : "eng"; }
        catch (e) { return "eng"; }
      })());
      function setOcrMode(mode) {
        if (ocrMode.value === mode) return;
        ocrMode.value = mode;
        try { localStorage.setItem(LANG_MODE_KEY, mode); } catch (e) { /* ignore */ }
      }
      const stage = ref("input");           // 'input' | 'crop' | 'processing' | 'result'
      const captureErr = ref("");
      const previewUrl = ref("");           // data URL for preview (also stored)
      const ocrText = ref("");
      const ocrRawText = ref("");           // post-confidence-filter, pre-word-filter
      const ocrFilteredText = ref("");      // post-word-filter (単語フィルタ)
      const wordFilterOn = ref(loadWordFilterPref());
      const ocrConf = ref(null);
      const engineUsed = ref("");           // 'paddle' | 'tesseract'
      const progress = ref(0);
      const progStatus = ref("");
      const cropRect = ref({ x: 0.1, y: 0.35, w: 0.8, h: 0.3 });
      const stageEl = ref(null);
      let currentBitmap = null;             // non-reactive

      // ---- list state ----
      const records = ref([]);
      const listErr = ref("");
      const filterDate = ref(null);
      const today = new Date();
      const calY = ref(today.getFullYear());
      const calM = ref(today.getMonth());   // 0-based

      async function refreshRecords() {
        try {
          const all = await dbAll();
          all.sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
          records.value = all;
          listErr.value = "";
        } catch (e) { listErr.value = "記録の読み込みに失敗しました: " + e.message; }
      }

      // ---- image input -> crop stage ----
      async function handleBlob(blob) {
        captureErr.value = "";
        if (!blob || (blob.type && blob.type.indexOf("image") !== 0)) {
          captureErr.value = "画像ファイルを選択してください。";
          return;
        }
        try {
          currentBitmap = await loadBitmap(blob);
          previewUrl.value = toStorageDataUrl(currentBitmap);
          cropRect.value = { x: 0.1, y: 0.35, w: 0.8, h: 0.3 };
          ocrText.value = ""; ocrRawText.value = ""; ocrFilteredText.value = "";
          ocrConf.value = null; engineUsed.value = "";
          stage.value = "crop";
        } catch (e) {
          captureErr.value = "画像の読み込みに失敗しました: " + (e && e.message ? e.message : e);
          stage.value = "input";
        }
      }

      function setStatus(msg, p) {
        progStatus.value = msg;
        if (typeof p === "number") progress.value = p;
      }

      // Runs the 単語フィルタ (word filter) on freshly recognized text and
      // decides what the textarea shows. cleanedRawText is the text AFTER the
      // existing per-engine confidence filters (Tesseract word-confidence /
      // PaddleOCR score threshold) -- this function only adds the
      // dictionary+pattern token classifier on top of that.
      async function applyWordFilterAndFinish(cleanedRawText) {
        ocrRawText.value = cleanedRawText;
        let dict = null;
        try { dict = await getWordSet(setStatus); } catch (e) { dict = null; }
        const filtered = filterTokens(cleanedRawText, dict);
        if (filtered && filtered.trim()) {
          ocrFilteredText.value = filtered;
        } else {
          // Never make results strictly worse: if the word filter removed
          // everything but there was real raw text, fall back to raw and
          // reflect that in the toggle for this result. This does not
          // overwrite the user's stored ON/OFF preference for next time.
          ocrFilteredText.value = cleanedRawText;
          if (cleanedRawText && cleanedRawText.trim()) wordFilterOn.value = false;
        }
        ocrText.value = wordFilterOn.value ? ocrFilteredText.value : ocrRawText.value;
      }

      function toggleWordFilter() {
        wordFilterOn.value = !wordFilterOn.value;
        try { localStorage.setItem(WORD_FILTER_KEY, wordFilterOn.value ? "1" : "0"); } catch (e) { /* ignore */ }
        ocrText.value = wordFilterOn.value ? ocrFilteredText.value : ocrRawText.value;
      }

      // ---- OCR pipeline ----
      // Engine routing:
      //   cropped 英数字 -> PaddleOCR PP-OCRv4 (rec-only), Tesseract fallback
      //   everything else (full image, or 日本語) -> Tesseract
      async function runOcr(useCrop) {
        captureErr.value = "";
        stage.value = "processing";
        progress.value = 0.05; progStatus.value = "画像を準備中…";
        ocrText.value = ""; ocrRawText.value = ""; ocrFilteredText.value = "";
        ocrConf.value = null; engineUsed.value = "";
        wordFilterOn.value = loadWordFilterPref();
        try {
          const cropCanvas = useCrop ? cropFromBitmap(currentBitmap, cropRect.value) : null;
          const usePaddle = (ocrMode.value === "eng" && useCrop);

          if (usePaddle) {
            try {
              await releaseTessWorker();
              const { text, score } = await paddleRecognize(cropCanvas, setStatus);
              engineUsed.value = "paddle";
              ocrConf.value = score != null ? Math.round(score * 100) : null;
              await applyWordFilterAndFinish(cleanText(text));
              stage.value = "result";
              return;
            } catch (e) {
              console.warn("PaddleOCR failed, falling back to Tesseract:", e);
              // fall through to the Tesseract path on the same crop
            }
          }

          // Tesseract path (full image, 日本語, or Paddle fallback)
          releasePaddle();
          const pre = useCrop ? preprocessCrop(cropCanvas)
            : { canvas: preprocess(currentBitmap), singleLine: false };
          progress.value = 0.1; progStatus.value = "OCRエンジンを準備中…";
          const worker = await getWorker(ocrMode.value, (m) => {
            progStatus.value = mapStatus(m.status);
            if (typeof m.progress === "number") progress.value = m.progress;
          });
          const params = {
            tessedit_pageseg_mode: useCrop ? (pre.singleLine ? "7" : "6") : "3"
          };
          params.tessedit_char_whitelist = ocrMode.value === "eng"
            ? "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-./:()#"
            : "";
          // jpn (jpn+eng): keep the spaces the engine finds between words so a
          // half-width digit run embedded between kanji (東京都千代田区 1-2-3)
          // isn't glued to the surrounding CJK, and so the word filter can see
          // the digit token as its own token.
          if (ocrMode.value === "jpn") params.preserve_interword_spaces = "1";
          await worker.setParameters(params);
          progStatus.value = "認識中…";
          const { data } = await worker.recognize(pre.canvas);
          engineUsed.value = "tesseract";
          const rawText = data && data.text ? data.text : "";
          const filteredConf = filterLowConfWords(data);
          // Never make results strictly worse: fall back to the raw text if
          // filtering by word confidence removed everything (or couldn't run).
          let cleanedResult = cleanText(filteredConf && filteredConf.trim() ? filteredConf : rawText);
          // Fold full-width ASCII/digits/dashes to half-width in jpn mode
          // (before the word filter) so stored addresses / model numbers read
          // back in plain ASCII and digit tokens match the filter's rules.
          if (ocrMode.value === "jpn") cleanedResult = normalizeWidth(cleanedResult);
          ocrConf.value = data && typeof data.confidence === "number" ? Math.round(data.confidence) : null;
          await applyWordFilterAndFinish(cleanedResult);
          stage.value = "result";
        } catch (e) {
          captureErr.value = "文字認識に失敗しました: " + (e && e.message ? e.message : e);
          stage.value = currentBitmap ? "crop" : "input";
        }
      }

      function onFileInput(ev) {
        const f = ev.target.files && ev.target.files[0];
        ev.target.value = "";
        if (f) handleBlob(f);
      }

      async function pasteFromClipboard() {
        captureErr.value = "";
        if (!navigator.clipboard || !navigator.clipboard.read) {
          captureErr.value = "このブラウザではクリップボードからの読み取りに対応していません。画像を貼り付ける (Ctrl/Cmd+V) か、他のボタンをご利用ください。";
          return;
        }
        try {
          const items = await navigator.clipboard.read();
          for (const it of items) {
            const type = it.types.find((t) => t.indexOf("image") === 0);
            if (type) { const blob = await it.getType(type); await handleBlob(blob); return; }
          }
          captureErr.value = "クリップボードに画像が見つかりませんでした。";
        } catch (e) {
          captureErr.value = "クリップボードの読み取りが拒否されました: " + (e && e.message ? e.message : e);
        }
      }

      function onPaste(ev) {
        if (!ev.clipboardData) return;
        const items = ev.clipboardData.items || [];
        for (const it of items) {
          if (it.kind === "file" && it.type.indexOf("image") === 0) {
            const blob = it.getAsFile();
            if (blob) { ev.preventDefault(); handleBlob(blob); return; }
          }
        }
      }

      // ---- crop overlay drag/resize (pointer events: touch + mouse) ----
      let dragState = null;
      function onCropDown(mode, ev) {
        if (!stageEl.value) return;
        ev.preventDefault(); ev.stopPropagation();
        const rect = stageEl.value.getBoundingClientRect();
        dragState = { mode, rect, startX: ev.clientX, startY: ev.clientY, orig: Object.assign({}, cropRect.value) };
        window.addEventListener("pointermove", onCropMove);
        window.addEventListener("pointerup", onCropUp);
        window.addEventListener("pointercancel", onCropUp);
      }
      function onCropMove(ev) {
        if (!dragState) return;
        const { mode, rect, startX, startY, orig } = dragState;
        const dx = rect.width ? (ev.clientX - startX) / rect.width : 0;
        const dy = rect.height ? (ev.clientY - startY) / rect.height : 0;
        const MIN = 0.05;
        let x = orig.x, y = orig.y, w = orig.w, h = orig.h;
        if (mode === "move") {
          x = clamp(orig.x + dx, 0, 1 - orig.w);
          y = clamp(orig.y + dy, 0, 1 - orig.h);
        } else {
          if (mode.indexOf("w") >= 0) { const nx = clamp(orig.x + dx, 0, orig.x + orig.w - MIN); w = orig.w + (orig.x - nx); x = nx; }
          if (mode.indexOf("e") >= 0) { w = clamp(orig.w + dx, MIN, 1 - orig.x); }
          if (mode.indexOf("n") >= 0) { const ny = clamp(orig.y + dy, 0, orig.y + orig.h - MIN); h = orig.h + (orig.y - ny); y = ny; }
          if (mode.indexOf("s") >= 0) { h = clamp(orig.h + dy, MIN, 1 - orig.y); }
        }
        cropRect.value = { x, y, w, h };
      }
      function onCropUp() {
        dragState = null;
        window.removeEventListener("pointermove", onCropMove);
        window.removeEventListener("pointerup", onCropUp);
        window.removeEventListener("pointercancel", onCropUp);
      }

      async function saveRecord() {
        try {
          const now = new Date();
          const rec = {
            id: (now.getTime() + "-" + Math.random().toString(36).slice(2, 8)),
            createdAt: now.toISOString(),
            dateKey: localDateKey(now),
            text: ocrText.value,
            imageDataUrl: previewUrl.value
          };
          await dbPut(rec);
          await refreshRecords();
          discard();
          showToast("保存しました");
          view.value = "list";
        } catch (e) {
          captureErr.value = "保存に失敗しました: " + (e && e.message ? e.message : e);
        }
      }

      function discard() {
        stage.value = "input";
        previewUrl.value = ""; ocrText.value = ""; ocrRawText.value = ""; ocrFilteredText.value = "";
        ocrConf.value = null; engineUsed.value = "";
        progress.value = 0; progStatus.value = ""; currentBitmap = null;
      }
      function backToCrop() {
        if (!currentBitmap) { stage.value = "input"; return; }
        captureErr.value = "";
        stage.value = "crop";
      }

      async function deleteRecord(rec) {
        if (!window.confirm("この記録を削除しますか？")) return;
        try { await dbDelete(rec.id); await refreshRecords(); showToast("削除しました"); }
        catch (e) { listErr.value = "削除に失敗しました: " + e.message; }
      }

      async function copyRecord(rec) {
        const ok = await copyText(rec.text);
        showToast(ok ? "コピーしました" : "コピーに失敗しました");
      }

      // ---- inline record text editing ----
      // Only one record can be in edit mode at a time: editingId is a single
      // ref, so opening 編集 on another record just overwrites it (and
      // editText with it), discarding whatever was unsaved in the previous one.
      const editingId = ref(null);
      const editText = ref("");
      function startEdit(rec) {
        editingId.value = rec.id;
        editText.value = rec.text || "";
      }
      function cancelEdit() {
        editingId.value = null;
        editText.value = "";
      }
      async function saveEdit(rec) {
        try {
          // Same id -- do not touch createdAt/dateKey, only the text changes.
          await dbPut(Object.assign({}, rec, { text: editText.value }));
          await refreshRecords();
          editingId.value = null;
          editText.value = "";
          showToast("更新しました");
        } catch (e) {
          listErr.value = "更新に失敗しました: " + (e && e.message ? e.message : e);
        }
      }

      // ---- lightbox & re-OCR from a saved record ----
      const lightboxUrl = ref("");

      // Saved images are the <=800px storage JPEGs, so a re-run works from
      // that resolution (not the original camera photo).
      async function reOcrRecord(rec) {
        try {
          const blob = await (await fetch(rec.imageDataUrl)).blob();
          view.value = "capture";
          await handleBlob(blob);
        } catch (e) {
          showToast("画像の読み込みに失敗しました");
        }
      }

      // ---- calendar / grouping ----
      const countsByDate = computed(() => {
        const m = {};
        for (const r of records.value) m[r.dateKey] = (m[r.dateKey] || 0) + 1;
        return m;
      });
      const visibleGroups = computed(() => {
        const groups = {};
        for (const r of records.value) {
          if (filterDate.value && r.dateKey !== filterDate.value) continue;
          (groups[r.dateKey] = groups[r.dateKey] || []).push(r);
        }
        return Object.keys(groups).sort().reverse().map((k) => ({ key: k, items: groups[k] }));
      });
      const calCells = computed(() => {
        const y = calY.value, m = calM.value;
        const first = new Date(y, m, 1).getDay();
        const days = new Date(y, m + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < first; i++) cells.push(null);
        for (let d = 1; d <= days; d++) cells.push(y + "-" + pad2(m + 1) + "-" + pad2(d));
        return cells;
      });
      function prevMonth() { if (calM.value === 0) { calM.value = 11; calY.value--; } else calM.value--; }
      function nextMonth() { if (calM.value === 11) { calM.value = 0; calY.value++; } else calM.value++; }

      onMounted(() => {
        refreshRecords();
        window.addEventListener("paste", onPaste);
      });

      // ---------------- render helpers ----------------
      function fileButton(labelText, capture) {
        const attrs = { type: "file", accept: "image/*", class: "hidden-file", onChange: onFileInput };
        if (capture) attrs.capture = "environment";
        return h("label", { class: "btn" + (capture ? "" : " sec") + " filebtn" }, [
          h("input", attrs), labelText
        ]);
      }

      function renderProcessing() {
        return h("div", { class: "card" }, [
          h("div", { class: "progwrap" }, [
            h("div", { class: "progbar" }, [
              h("div", { class: "progfill", style: { width: Math.round(progress.value * 100) + "%" } })
            ]),
            h("div", { class: "progtxt" }, progStatus.value + " " + Math.round(progress.value * 100) + "%")
          ]),
          previewUrl.value ? h("img", { class: "preview", src: previewUrl.value, alt: "" }) : null
        ]);
      }

      function renderCrop() {
        const r = cropRect.value;
        const box = {
          left: (r.x * 100) + "%", top: (r.y * 100) + "%",
          width: (r.w * 100) + "%", height: (r.h * 100) + "%"
        };
        return h("div", {}, [
          captureErr.value ? h("div", { class: "err" }, captureErr.value) : null,
          h("div", { class: "card" }, [
            h("h2", { class: "sec" }, "読み取る範囲を選択"),
            h("div", { class: "crop-stage", ref: stageEl }, [
              h("img", { class: "crop-img", src: previewUrl.value, alt: "撮影した画像" }),
              h("div", { class: "crop-overlay", style: box, onPointerdown: (e) => onCropDown("move", e) }, [
                h("div", { class: "crop-handle nw", onPointerdown: (e) => onCropDown("nw", e) }),
                h("div", { class: "crop-handle ne", onPointerdown: (e) => onCropDown("ne", e) }),
                h("div", { class: "crop-handle sw", onPointerdown: (e) => onCropDown("sw", e) }),
                h("div", { class: "crop-handle se", onPointerdown: (e) => onCropDown("se", e) })
              ])
            ]),
            h("div", { class: "hint" }, "読み取りたい文字の周りを枠で囲みます。四隅をドラッグして調整できます。"),
            h("div", { class: "btn-row", style: { marginTop: "12px" } }, [
              h("button", { class: "btn", onClick: () => runOcr(true) }, "この範囲を読み取る")
            ]),
            h("div", { class: "btn-row", style: { marginTop: "10px" } }, [
              h("button", { class: "btn sec", onClick: () => runOcr(false) }, "全体を読み取る"),
              h("button", { class: "btn sec", onClick: discard }, "やり直す")
            ])
          ])
        ]);
      }

      function renderResult() {
        const engineName = engineUsed.value === "paddle" ? "PaddleOCR (PP-OCRv4)" : "Tesseract";
        return h("div", {}, [
          captureErr.value ? h("div", { class: "err" }, captureErr.value) : null,
          h("div", { class: "card" }, [
            h("h2", { class: "sec" }, "認識結果 — 保存しますか？"),
            h("img", { class: "preview", src: previewUrl.value, alt: "撮影した画像" }),
            h("div", { class: "engine" }, ["エンジン: ", h("b", {}, engineName)]),
            ocrConf.value != null ? h("div", { class: "conf" }, "信頼度: " + ocrConf.value + "%") : null,
            h("div", { class: "wfrow" }, [
              h("span", { class: "wflabel" }, "単語フィルタ"),
              h("button", {
                class: "wftoggle" + (wordFilterOn.value ? " on" : ""),
                onClick: toggleWordFilter
              }, wordFilterOn.value ? "ON" : "OFF")
            ]),
            h("textarea", {
              value: ocrText.value,
              onInput: (e) => { ocrText.value = e.target.value; },
              spellcheck: "false"
            }),
            // 保存する stands alone as the single, full-width primary action.
            // 破棄/範囲を選び直す are a secondary pair on their own row below --
            // deliberately not beside 保存する, so a mis-tap can't hit save
            // when the user meant to discard (or vice versa).
            h("div", { class: "btn-row", style: { marginTop: "14px" } }, [
              h("button", { class: "btn ok", onClick: saveRecord }, "保存する")
            ]),
            h("div", { class: "btn-row", style: { marginTop: "10px" } }, [
              h("button", { class: "btn sec", onClick: backToCrop }, "範囲を選び直す"),
              h("button", { class: "btn sec", onClick: discard }, "破棄")
            ])
          ])
        ]);
      }

      function renderInput() {
        return h("div", {}, [
          captureErr.value ? h("div", { class: "err" }, captureErr.value) : null,
          h("div", { class: "card" }, [
            h("h2", { class: "sec" }, "認識モード"),
            h("div", { class: "nav" }, [
              h("button", {
                class: ocrMode.value === "eng" ? "active" : "",
                onClick: () => setOcrMode("eng")
              }, "英数字(型番向け)"),
              h("button", {
                class: ocrMode.value === "jpn" ? "active" : "",
                onClick: () => setOcrMode("jpn")
              }, "日本語+英数字")
            ]),
            h("details", { class: "acc" }, [
              h("summary", {}, "このモードについて"),
              ocrMode.value === "eng"
                ? h("div", { class: "hint" }, "英数字モードは、範囲を選んで読み取ると高精度エンジン PaddleOCR (PP-OCRv4) を使用します。初回の範囲読み取り時のみ、モデルとエンジン（合計 約22MB）をダウンロードします。「全体を読み取る」は Tesseract で処理します。")
                : h("div", { class: "hint" }, "日本語モードは Tesseract（jpn+eng の複合モデル）を使用します。和文中の半角英数字（住所の 1-2-3 や型番）の精度を上げるため日本語と英数字の学習データを併用し、初回のみ言語データ（約5MB）をダウンロードするため、少し時間がかかります。")
            ])
          ]),
          h("div", { class: "card" }, [
            h("h2", { class: "sec" }, "ラベルを撮影・選択"),
            fileButton("カメラで撮影", true),
            h("div", { style: { height: "10px" } }),
            fileButton("画像を選択", false),
            h("div", { style: { height: "10px" } }),
            h("button", { class: "btn sec", onClick: pasteFromClipboard }, "クリップボードから貼り付け"),
            h("details", { class: "acc" }, [
              h("summary", {}, "撮影のコツ"),
              h("div", { class: "hint" }, "型番・製造番号のシールを大きく、明るく撮影すると精度が上がります。撮影後に読み取る範囲を選べます。画像をコピーして Ctrl/Cmd+V でも貼り付けできます。")
            ])
          ])
        ]);
      }

      function renderCapture() {
        if (stage.value === "processing") return renderProcessing();
        if (stage.value === "crop") return renderCrop();
        if (stage.value === "result") return renderResult();
        return renderInput();
      }

      function renderRecord(rec) {
        const isEditing = editingId.value === rec.id;
        // In edit mode the other actions (コピー/再読み取り/削除) are not
        // rendered at all -- simplest way to guarantee no mis-taps while a
        // save/cancel decision is pending on this card.
        const bodyRest = isEditing
          ? [
              h("textarea", {
                value: editText.value,
                onInput: (e) => { editText.value = e.target.value; },
                spellcheck: "false"
              }),
              h("div", { class: "editrow" }, [
                h("button", { class: "save", onClick: () => saveEdit(rec) }, "保存"),
                h("button", { class: "cancel", onClick: cancelEdit }, "キャンセル")
              ])
            ]
          : [
              h("div", { class: "txt" }, rec.text || "(テキストなし)"),
              h("div", { class: "acts" }, [
                h("div", { class: "actrow" }, [
                  h("button", { onClick: () => copyRecord(rec) }, "コピー"),
                  h("button", { onClick: () => reOcrRecord(rec) }, "再読み取り")
                ]),
                h("div", { class: "actrow" }, [
                  h("button", { onClick: () => startEdit(rec) }, "編集"),
                  h("button", { class: "del", onClick: () => deleteRecord(rec) }, "削除")
                ])
              ])
            ];
        return h("div", { class: "rec", key: rec.id }, [
          h("img", {
            class: "thumb", src: rec.imageDataUrl, alt: "保存した画像(タップで拡大)",
            onClick: () => { lightboxUrl.value = rec.imageDataUrl; }
          }),
          h("div", { class: "body" }, [
            h("div", { class: "time" }, timeLabel(rec.createdAt)),
            ...bodyRest
          ])
        ]);
      }

      function renderCalendar() {
        const dow = ["日", "月", "火", "水", "木", "金", "土"];
        return h("div", { class: "cal" }, [
          h("div", { class: "calhead" }, [
            h("button", { class: "calnav", onClick: prevMonth, "aria-label": "前の月" }, "‹"),
            h("div", { class: "mlabel" }, calY.value + "年 " + (calM.value + 1) + "月"),
            h("button", { class: "calnav", onClick: nextMonth, "aria-label": "次の月" }, "›")
          ]),
          h("div", { class: "calgrid" }, [
            ...dow.map((d) => h("div", { class: "caldow", key: "dow" + d }, d)),
            ...calCells.value.map((key, i) => {
              if (!key) return h("div", { class: "calcell empty", key: "e" + i });
              const cnt = countsByDate.value[key] || 0;
              const cls = "calcell" + (cnt ? " has" : "") + (filterDate.value === key ? " sel" : "");
              const day = +key.split("-")[2];
              return h("div", {
                class: cls, key: key,
                onClick: () => { if (cnt) filterDate.value = (filterDate.value === key ? null : key); }
              }, [
                String(day),
                cnt ? h("span", { class: "caldot" }, String(cnt)) : null
              ]);
            })
          ])
        ]);
      }

      function renderList() {
        return h("div", {}, [
          listErr.value ? h("div", { class: "err" }, listErr.value) : null,
          renderCalendar(),
          filterDate.value
            ? h("button", { class: "btn sec", style: { marginBottom: "12px" }, onClick: () => { filterDate.value = null; } },
                dateHeaderLabel(filterDate.value) + " のみ表示中 — すべて表示")
            : null,
          visibleGroups.value.length === 0
            ? h("div", { class: "empty-note" }, "保存された記録はありません。")
            : visibleGroups.value.map((g) =>
                h("div", { key: g.key }, [
                  h("div", { class: "datehdr" }, dateHeaderLabel(g.key)),
                  ...g.items.map(renderRecord)
                ])
              )
        ]);
      }

      return () => h("div", {}, [
        h("header", {}, [
          h("h1", {}, "ラベルOCR"),
          h("div", { class: "nav" }, [
            h("button", { class: view.value === "capture" ? "active" : "", onClick: () => { view.value = "capture"; } }, "撮影"),
            h("button", { class: view.value === "list" ? "active" : "", onClick: () => { view.value = "list"; refreshRecords(); } }, "一覧")
          ])
        ]),
        h("main", {}, view.value === "capture" ? renderCapture() : renderList()),
        lightboxUrl.value
          ? h("div", { class: "lightbox", onClick: () => { lightboxUrl.value = ""; } }, [
              h("img", { src: lightboxUrl.value, alt: "保存した画像" }),
              h("button", { class: "lightbox-close", "aria-label": "閉じる" }, "✕")
            ])
          : null,
        toast.value ? h("div", { class: "toast" }, toast.value) : null
      ]);
    }
  };

  createApp(App).mount("#app");
})();
</script>
