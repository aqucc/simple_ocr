<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-a1ebjh1NBE9lEBBcSDunR0/gh2Igfd5YWCEbz18r2MA=' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'sha256-e/UdbrFOdqpNzMKLnQ6JvtiAWPlGmQI2o4QtOFCxdnw='; img-src 'self' blob: data:; connect-src 'self' https://cdn.jsdelivr.net data:; worker-src blob:; base-uri 'none'; form-action 'none'">
<title>ラベルOCR</title>
<style>
:root{
  --bg:#0f1115; --panel:#1a1d24; --panel2:#232732; --line:#2e3440;
  --fg:#e8eaf0; --muted:#9aa3b2; --accent:#4c8dff; --accent2:#2f6fe0;
  --danger:#ff5a5f; --ok:#37c871; --radius:14px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f2f4f8; --panel:#ffffff; --panel2:#eef1f6; --line:#d8dee9;
    --fg:#1a1d24; --muted:#5b6472; --accent:#2f6fe0; --accent2:#1f5bc4; }
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:16px; line-height:1.5; overscroll-behavior:none; }
#app{ max-width:680px; margin:0 auto; }
/* App shell: exactly one viewport tall, non-scrolling. Only <main> scrolls
   (records list); everything else is fixed height. Kills iOS rubber-band. */
.shell{ height:100svh; display:flex; flex-direction:column; overflow:hidden; }
header{ position:relative; z-index:10; background:var(--panel); flex:0 0 auto;
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px; }
header h1{ font-size:17px; margin:0 0 8px; text-align:center; font-weight:700; }
header h1 .ver{ font-size:10px; font-weight:400; color:var(--muted); margin-left:6px; vertical-align:middle; }
.nav{ display:flex; gap:8px; }
.nav button{ flex:1; min-height:44px; border:1px solid var(--line); background:var(--panel2);
  color:var(--fg); border-radius:10px; font-size:15px; font-weight:600; }
.nav button.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
main{ flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain; padding:12px 12px calc(env(safe-area-inset-bottom) + 14px); }
.card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; margin-bottom:14px; }
.btn{ display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; min-height:52px; border:none; border-radius:12px; font-size:16px;
  font-weight:700; color:#fff; background:var(--accent); margin:0; }
.btn:active{ background:var(--accent2); }
.btn.sec{ background:var(--panel2); color:var(--fg); border:1px solid var(--line); }
.btn.danger{ background:var(--danger); }
.btn.ok{ background:var(--ok); }
.btn-row{ display:flex; gap:10px; }
.btn-row .btn{ flex:1; }
.hidden-file{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
label.filebtn{ cursor:pointer; }
.hint{ color:var(--muted); font-size:13px; margin:8px 2px 0; }
.err{ background:rgba(255,90,95,.14); border:1px solid var(--danger); color:var(--danger);
  padding:10px 12px; border-radius:10px; font-size:14px; margin-bottom:12px; white-space:pre-wrap; }
.preview{ width:100%; border-radius:10px; display:block; background:var(--panel2);
  border:1px solid var(--line); max-height:46vh; object-fit:contain; }
textarea{ width:100%; min-height:104px; resize:vertical; background:var(--panel2);
  color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:10px;
  font-size:16px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
.progwrap{ margin:10px 0; }
.progbar{ height:12px; background:var(--panel2); border:1px solid var(--line);
  border-radius:8px; overflow:hidden; }
.progfill{ height:100%; background:var(--accent); transition:width .2s ease; }
.progtxt{ font-size:13px; color:var(--muted); margin-top:6px; text-align:center; }
.conf{ font-size:13px; color:var(--muted); margin:8px 2px; }
.wfrow{ display:flex; align-items:center; justify-content:space-between; margin:2px 2px 8px; }
.wflabel{ font-size:13px; color:var(--muted); font-weight:700; }
.wftoggle{ min-width:64px; min-height:30px; padding:0 14px; border-radius:15px;
  border:1px solid var(--line); background:var(--panel2); color:var(--muted);
  font-size:12px; font-weight:800; letter-spacing:.03em; }
.wftoggle.on{ background:var(--ok); border-color:var(--ok); color:#fff; }
.engine{ font-size:13px; color:var(--muted); margin:2px 2px 8px; }
.engine b{ color:var(--fg); }
h2.sec{ font-size:14px; color:var(--muted); margin:2px 2px 10px; font-weight:700; }
/* ---- crop stage ---- */
.crop-stage{ position:relative; width:100%; margin:2px auto 4px; touch-action:none;
  user-select:none; -webkit-user-select:none; background:var(--panel2);
  border:1px solid var(--line); border-radius:10px; overflow:hidden; }
/* The stage is given an explicit px width/height (computed from the image's
   natural aspect ratio and a height cap) so its box stays EXACTLY the image's
   rendered box -- the overlay's %-coordinates then map 1:1 onto the image --
   while never growing tall enough to force a scroll on small phones (SE2).
   The image fills that box; since the box keeps the image aspect ratio,
   object-fit:fill introduces no visible distortion. */
.crop-img{ display:block; width:100%; height:100%; object-fit:fill; max-height:44svh;
  pointer-events:none; }
.crop-overlay{ position:absolute; border:2px solid var(--accent);
  box-shadow:0 0 0 100vmax rgba(0,0,0,.5); box-sizing:border-box; cursor:move; touch-action:none; }
.crop-handle{ position:absolute; width:30px; height:30px; background:var(--accent);
  border:2px solid #fff; border-radius:50%; touch-action:none; }
.crop-handle.nw{ left:-15px; top:-15px; cursor:nwse-resize; }
.crop-handle.ne{ right:-15px; top:-15px; cursor:nesw-resize; }
.crop-handle.sw{ left:-15px; bottom:-15px; cursor:nesw-resize; }
.crop-handle.se{ right:-15px; bottom:-15px; cursor:nwse-resize; }
/* Quad (台形補正) overlay: SVG polygon outline + 4 free corner handles. */
.quad-svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.crop-handle.qh{ transform:translate(-50%,-50%); cursor:move; }
.segctl{ display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:0; }
.segctl button{ min-height:38px; padding:0 16px; border:none; background:var(--panel2);
  color:var(--muted); font-size:13px; font-weight:800; }
.segctl button.on{ background:var(--accent); color:#fff; }
/* Compact one-row control strip on the recognition (crop) screen: recognition
   mode (英数字/日本語) on the left, crop shape (矩形/台形) on the right. */
.cropctl{ display:flex; gap:10px; align-items:center; justify-content:space-between;
  flex-wrap:wrap; margin:0 0 10px; }
/* Recognition screens fill the viewport so they never need to scroll: the card
   is a flex column and its textarea (result) absorbs the slack. */
.ocrscreen{ display:flex; flex-direction:column; height:100%; }
.ocrscreen > .card{ flex:1; display:flex; flex-direction:column; min-height:0; margin-bottom:0; }
.ocrscreen .resultcard textarea{ flex:1 1 auto; min-height:64px; }
.preview.compact{ max-height:22svh; }
.cal{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; margin-bottom:14px; }
.calhead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.calhead .mlabel{ font-weight:700; font-size:15px; }
.calnav{ min-width:44px; min-height:44px; border:1px solid var(--line); background:var(--panel2);
  color:var(--fg); border-radius:10px; font-size:18px; }
.calgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.caldow{ text-align:center; font-size:12px; color:var(--muted); padding:4px 0; }
.calcell{ position:relative; aspect-ratio:1/1; border:1px solid transparent; border-radius:9px;
  background:transparent; color:var(--fg); font-size:14px; display:flex;
  align-items:center; justify-content:center; }
.calcell.has{ background:var(--panel2); border-color:var(--line); font-weight:700; }
.calcell.sel{ background:var(--accent); color:#fff; border-color:var(--accent); }
.calcell.empty{ background:transparent; }
.caldot{ position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
  min-width:15px; height:15px; padding:0 3px; border-radius:8px; background:var(--accent);
  color:#fff; font-size:10px; line-height:15px; text-align:center; }
.calcell.sel .caldot{ background:#fff; color:var(--accent); }
.datehdr{ font-size:14px; font-weight:700; color:var(--muted); margin:16px 2px 8px;
  padding-bottom:6px; border-bottom:1px solid var(--line); }
.rec{ display:flex; gap:12px; }
.rec .thumb{ width:74px; height:74px; flex:0 0 74px; border-radius:10px; object-fit:cover;
  background:var(--panel2); border:1px solid var(--line); }
.rec .body{ flex:1; min-width:0; }
.rec .time{ font-size:12px; color:var(--muted); }
.rec .txt{ white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,Menlo,monospace;
  font-size:14px; margin:4px 0 8px; }
/* Action buttons: two rows (primary: コピー/再読み取り, secondary: 編集/削除)
   instead of 4-across so each target stays >=44px tall with >=8px gaps even
   at 375px width. 削除 gets a tinted danger background (not just a border) so
   it reads as visually distinct from the neutral row above it. */
.rec .acts{ display:flex; flex-direction:column; gap:8px; }
.rec .acts .actrow{ display:flex; gap:8px; }
.rec .acts button{ flex:1; min-height:44px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel2); color:var(--fg); font-size:14px; font-weight:600; }
.rec .acts button.del{ background:rgba(255,90,95,.14); color:var(--danger); border-color:var(--danger); }
.rec textarea{ min-height:88px; font-size:14px; margin:4px 0 0; }
.rec .editrow{ display:flex; gap:8px; margin-top:8px; }
.rec .editrow button{ flex:1; min-height:44px; border-radius:10px; border:none;
  font-size:14px; font-weight:700; }
.rec .editrow button.save{ background:var(--ok); color:#fff; }
.rec .editrow button.cancel{ background:var(--panel2); color:var(--fg); border:1px solid var(--line); }
.empty-note{ text-align:center; color:var(--muted); padding:30px 10px; }
.spinner{ width:20px; height:20px; border:3px solid rgba(255,255,255,.4);
  border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
details.acc{ margin-top:8px; }
details.acc summary{ list-style:none; cursor:pointer; min-height:44px;
  display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px;
  -webkit-user-select:none; user-select:none; }
details.acc summary::-webkit-details-marker{ display:none; }
details.acc summary::before{ content:"▸"; font-size:11px; transition:transform .15s ease; }
details.acc[open] summary::before{ transform:rotate(90deg); }
details.acc .hint{ margin-top:0; }
.rec .thumb{ cursor:zoom-in; }
/* Recognition function: a full-screen modal (dialog) over the app. It carries
   no 撮影/一覧 tabs -- recognition is its own focused task with its own close (✕)
   and cancel. Fixed height, non-scrolling body (image is height-capped). */
.ocr-modal{ position:fixed; inset:0; z-index:60; background:var(--bg);
  display:flex; flex-direction:column; overflow:hidden; padding:0 0 env(safe-area-inset-bottom); }
.ocr-modal .modalbar{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 8px) 8px 8px 14px; border-bottom:1px solid var(--line);
  background:var(--panel); }
.ocr-modal .modalbar .mtitle{ font-size:15px; font-weight:700; }
.ocr-modal .modalclose{ min-width:40px; min-height:40px; border:none; border-radius:10px;
  background:transparent; color:var(--fg); font-size:20px; line-height:1; }
.ocr-modal .modalbody{ flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  display:flex; flex-direction:column; padding:12px; }
.ocr-modal .card{ margin-bottom:0; }
/* The three read/cancel actions sit in one row; shrink text so they fit at 375px. */
.btn-row.triple .btn{ font-size:14px; padding:0 4px; }
/* List: calendar-only screen has a bottom action row; day/all screens a top bar. */
.listbar{ display:flex; gap:10px; margin:0 0 12px; }
.listbar .btn{ flex:1; }
.lightbox{ position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.88);
  display:flex; align-items:center; justify-content:center; padding:16px; cursor:zoom-out; }
.lightbox img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }
.lightbox-close{ position:absolute; top:calc(env(safe-area-inset-top) + 12px); right:12px;
  min-width:44px; min-height:44px; border:none; border-radius:22px;
  background:rgba(255,255,255,.18); color:#fff; font-size:22px; line-height:1; }
.toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 20px);
  transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:10px 16px;
  border-radius:20px; font-size:14px; font-weight:600; z-index:50; max-width:90%; }
</style>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.runtime.global.prod.js"></script>
<script>
"use strict";
(function () {
  // Deploy version: the Pages workflow injects <meta name="app-version"> with
  // the commit SHA at staging time (the repo file itself has no such meta, so
  // local/dev shows "dev"). Lets the user see at a glance whether the browser
  // is serving a stale cached build.
  const APP_VERSION = (() => {
    const m = document.querySelector('meta[name="app-version"]');
    return (m && m.content) ? m.content : "dev";
  })();
  const { createApp, h, ref, computed, onMounted } = Vue;

  const LANG_MODE_KEY = "label_ocr_lang_mode";

  // ---- PaddleOCR (ONNX / onnxruntime-web) — the ONLY OCR engine ----
  // Both modes run entirely on ONNX Runtime Web + PaddleOCR models; Tesseract
  // has been retired. Pipelines:
  //   英数字 (eng): PP-OCRv4 text DETECTION (DBNet) + PP-OCRv4 recognition.
  //   日本語 (jpn): shared DBNet detection + a japan PP-OCRv3 recognition model.
  // Cropped reads skip detection (the user already isolated the region) and go
  // straight to the rec path; 「全体を読み取る」 runs DBNet first to find every
  // text line, crops each, then recognizes it. onnxruntime-web runs
  // single-threaded (GitHub Pages sends no COOP/COEP, so SharedArrayBuffer is
  // unavailable); SIMD is on, the proxy worker is off.
  const ORT = {
    script: "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.wasm.min.js",
    wasmDir: "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/"
  };
  const PADDLE = {
    // Shared DBNet detector + PP-OCRv4 rec/keys come from @gutenye/ocr-models on
    // jsdelivr (connect-src allows cdn.jsdelivr.net).
    det: "https://cdn.jsdelivr.net/npm/@gutenye/ocr-models@1.4.2/assets/ch_PP-OCRv4_det_infer.onnx",
    engRec: "https://cdn.jsdelivr.net/npm/@gutenye/ocr-models@1.4.2/assets/ch_PP-OCRv4_rec_infer.onnx",
    engDict: "https://cdn.jsdelivr.net/npm/@gutenye/ocr-models@1.4.2/assets/ppocr_keys_v1.txt",
    // The japan PP-OCRv3 rec model + its 4399-entry dict are SELF-HOSTED under a
    // same-origin models/ directory (committed in the repo); connect-src 'self'
    // covers them. Resolved relative to the document so it works from a subpath
    // (GitHub Pages: /simple_ocr/models). Over file:// this fetch fails (no
    // origin) — HTTP(S) serving is required for OCR, same as the CDN assets.
    jpnRec: new URL("models/japan_rec.onnx", document.baseURI).href,
    jpnDict: new URL("models/japan_dict.txt", document.baseURI).href
  };
  // Per-mode recognition config. Both PP-OCR rec models fix input height to 48
  // (the japan model has an internal reshape that REQUIRES exactly 48) and use
  // (x/255 - 0.5)/0.5 normalization with cv2/BGR channel order (matching
  // PaddleOCR training). CTCLabelDecode index 0 = blank, indices 1..N map to
  // dict[i-1]; the character list is the dict lines plus a trailing space
  // (use_space_char), so N = dict.length + 1. The japan dict already ends with
  // its own space entry AND the model was exported with an extra appended
  // space, so appending one here still lands on C-1 (verified: japan rec C =
  // 4401 = 4399 dict + 1 space + 1 blank).
  const REC_CFG = {
    eng: { rec: PADDLE.engRec, dict: PADDLE.engDict, label: "PaddleOCR (PP-OCRv4)" },
    jpn: { rec: PADDLE.jpnRec, dict: PADDLE.jpnDict, label: "PaddleOCR (PP-OCRv3 · japan)" }
  };
  const REC_H = 48;
  // DBNet detection post-process params (validated against the PP-OCRv4 det
  // model): resize long side <= 960 (each dim rounded to a multiple of 32),
  // normalize per-channel with ImageNet RGB mean/std, threshold the prob map at
  // 0.3, keep connected components whose mean prob >= 0.5 and area >= 9, then
  // unclip each box outward by distance = area * 1.6 / perimeter.
  const DET_MAX_SIDE = 960, DET_THRESH = 0.3, DET_BOX_THRESH = 0.5, DET_MIN_AREA = 9, DET_UNCLIP = 1.6;
  const DET_MEAN = [0.485, 0.456, 0.406], DET_STD = [0.229, 0.224, 0.225];

  // ---- Pinned English wordlist (単語フィルタ dictionary check) ----
  // npm `word-list` (Sindre Sorhus): a plain lowercase words.txt, ~274k
  // entries, ~2.68MB raw / ~697KB gzip over the wire (verified against the
  // npm tarball). Fetched lazily on first use of the word filter, not at
  // page load.
  const WORD_LIST_URL = "https://cdn.jsdelivr.net/npm/word-list@4.1.0/words.txt";
  const WORD_FILTER_KEY = "label_ocr_word_filter_on";
  function loadWordFilterPref() {
    try {
      const v = localStorage.getItem(WORD_FILTER_KEY);
      return v === null ? true : v === "1";
    } catch (e) { return true; }
  }

  // ---------------- IndexedDB ----------------
  const DB_NAME = "label_ocr_db", STORE = "records", DB_VER = 1;
  function openDB() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains(STORE)) {
          const os = db.createObjectStore(STORE, { keyPath: "id" });
          os.createIndex("dateKey", "dateKey", { unique: false });
        }
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error || new Error("IndexedDB open failed"));
    });
  }
  async function dbPut(rec) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(rec);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error || new Error("保存に失敗しました"));
    });
  }
  async function dbAll() {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readonly");
      const rq = tx.objectStore(STORE).getAll();
      rq.onsuccess = () => res(rq.result || []);
      rq.onerror = () => rej(rq.error || new Error("読み込みに失敗しました"));
    });
  }
  async function dbDelete(id) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error || new Error("削除に失敗しました"));
    });
  }

  // ---------------- Date helpers ----------------
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function localDateKey(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function timeLabel(iso) {
    const d = new Date(iso);
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  function dateHeaderLabel(key) {
    const p = key.split("-");
    const d = new Date(+p[0], +p[1] - 1, +p[2]);
    const dow = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
    return p[0] + "年" + (+p[1]) + "月" + (+p[2]) + "日 (" + dow + ")";
  }

  // ---------------- small math helpers ----------------
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function newCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
  function cleanText(t) { return (t || "").replace(/\n{3,}/g, "\n\n").trim(); }

  // Full-width -> half-width ASCII normalization for 日本語 mode output. The
  // user stores model numbers and addresses, so full-width digits/letters that
  // the jpn LSTM sometimes emits (０-９Ａ-Ｚａ-ｚ, full-width hyphen －, ideographic
  // space) are folded to their ASCII equivalents; various Unicode dash/minus
  // glyphs are folded to "-" so an address like 東京都千代田区1-2-3 or a code
  // like KX-1234 reads back in plain ASCII. The katakana chōonpu ー (U+30FC) is
  // deliberately NOT in any of these ranges, so real kana is left intact.
  function normalizeWidth(t) {
    if (!t) return t;
    return t
      .replace(/[！-～]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
      .replace(/　/g, " ")
      .replace(/[‐-―−⁃﹘﹣]/g, "-");
  }

  // ---------------- Word filter (単語フィルタ): hybrid dictionary + pattern
  // token classifier ----------------
  // Cert-mark logos (PSE, circled (R), circled seal marks, etc.) get misread
  // as stray symbols / isolated CJK characters / short nonsense tokens. A
  // *pure* dictionary filter would also delete the app's whole point --
  // model/serial numbers like "KX-1234AB" or "5X-98765" are not English
  // words -- so a token survives if it EITHER is a real English word OR
  // structurally looks like a model number / unit / known label
  // abbreviation. Symbol-noise Unicode ranges are stripped outright, and an
  // isolated single CJK character (the typical enclosure misread) is
  // dropped unless it's recognizable label vocabulary via a small embedded
  // lexicon.

  // Lazy-loaded, module-level cache: fetch word-list's words.txt on first
  // use, split/lowercase into a Set. If the fetch fails, the filter still
  // works in pattern-only mode (dictionary checks simply return false); no
  // user-facing error, console.warn only.
  let wordSet = null;
  let wordSetFailed = false;
  let wordSetPromise = null;
  async function getWordSet(onStatus) {
    if (wordSet) return wordSet;
    if (wordSetFailed) return null;
    if (wordSetPromise) return wordSetPromise;
    wordSetPromise = (async () => {
      try {
        if (onStatus) onStatus("辞書を読み込み中…", 0.92);
        const res = await fetch(WORD_LIST_URL);
        if (!res.ok) throw new Error("word-list fetch failed: " + res.status);
        const txt = await res.text();
        const set = new Set();
        for (const w of txt.split("\n")) {
          const t = w.trim().toLowerCase();
          if (t) set.add(t);
        }
        wordSet = set;
        return wordSet;
      } catch (e) {
        console.warn("Word list unavailable, filter running in pattern-only mode:", e);
        wordSetFailed = true;
        return null;
      } finally {
        wordSetPromise = null;
      }
    })();
    return wordSetPromise;
  }

  // Symbol noise: Unicode blocks that circled/boxed cert-mark misreads land
  // in (enclosed alphanumerics, enclosed/compat CJK, letterlike symbols,
  // geometric shapes, misc symbols & dingbats), plus a handful of common
  // mark characters that fall outside those blocks.
  const SYMBOL_NOISE_RE = /[①-⓿㈀-㋿㌀-㏿℀-⅏■-◿☀-➿©®™§※]/g;

  // CJK character ranges used for run-splitting: Hiragana, Katakana, CJK
  // Unified Ideographs (+ Ext-A), halfwidth Katakana.
  const CJK_RANGES = "\\u3040-\\u309F\\u30A0-\\u30FF\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uFF66-\\uFF9D";
  const CJK_CHAR_RE = new RegExp("^[" + CJK_RANGES + "]$");
  const CJK_SPACE_RE = new RegExp("([" + CJK_RANGES + "])\\s+(?=[" + CJK_RANGES + "])", "g");
  const CJK_SEGMENT_RE = new RegExp("[" + CJK_RANGES + "]+|[^" + CJK_RANGES + "]+", "g");
  function isCjkChar(ch) { return CJK_CHAR_RE.test(ch); }

  // Small embedded lexicon of Japanese appliance/label vocabulary. Lets a
  // short (even 2-char) CJK run survive as label text; an isolated single
  // kanji/kana (the typical enclosure misread) is still dropped by the
  // run-length >= 2 rule in filterLine below.
  const LABEL_LEXICON = [
    "型番", "品番", "型式", "形名", "製造番号", "製番", "号機",
    "製造年月", "製造年", "製造月", "製品名", "商品名", "品名",
    "定格", "定格電圧", "定格電流", "定格周波数", "定格出力",
    "電圧", "電流", "周波数", "消費電力", "出力", "入力",
    "容量", "質量", "重量", "寸法", "外形寸法",
    "電源", "電池", "単相", "三相", "交流", "直流",
    "株式会社", "有限会社", "合同会社",
    "製造元", "販売元", "発売元", "輸入元",
    "日本製", "中国製", "韓国製", "台湾製", "米国製",
    "原産国", "生産国",
    "取扱説明書", "取扱注意", "使用上の注意",
    "注意", "警告", "危険", "禁止",
    "保証書", "保証期間", "修理", "故障",
    "検査", "検査合格", "合格", "認証", "認定", "適合", "適合品",
    "安全", "安全基準", "規格", "準拠",
    "環境", "廃棄", "リサイクル", "分別",
    "材質", "樹脂", "金属",
    "部品番号", "部品名", "図番", "図番号",
    "仕様", "仕様書", "版数", "改訂", "改訂版"
  ];
  const LABEL_LEXICON_SET = new Set(LABEL_LEXICON);
  function cjkRunIsLexical(run) {
    if (LABEL_LEXICON_SET.has(run)) return true;
    for (const entry of LABEL_LEXICON) if (run.indexOf(entry) >= 0) return true;
    return false;
  }

  // ASCII token pattern rules.
  const MODEL_LIKE_RE = /^[A-Za-z0-9][A-Za-z0-9\-\/.:#+]*$/;
  const UNIT_RE = /^\d+(\.\d+)?(V|W|A|VA|Hz|kHz|mA|Ah|kg|g|L|mm|cm|°C)\.?$/i;
  const LABEL_ABBR = new Set([
    "MODEL", "MODELE", "TYPE", "SN", "S/N", "P/N", "NO", "NO.",
    "LOT", "REF", "AC", "DC", "PSE", "CE", "FCC", "MADE", "IN"
  ]);
  const TRAILING_PUNCT_RE = /[.,;:!?)"'\]]+$/;

  function isKeepAsciiToken(tok, dictSet, lineDigitCount) {
    if (!tok) return false;
    const stripped = tok.replace(TRAILING_PUNCT_RE, "");
    // EAN/UPC leading-digit exception: a barcode's human-readable digits are
    // conventionally printed as a lone leading digit plus two 6-digit groups
    // (e.g. "4 901234 567894"), so a single stray digit is otherwise
    // indistinguishable from cert-mark noise UNLESS its line clearly is a
    // barcode digit string (>= 6 digits total across the line). Deliberately
    // narrow: this does not otherwise relax the general length>=2 rule.
    if (/^\d$/.test(stripped) && lineDigitCount >= 6) return true;
    if (stripped.length >= 2 && dictSet && dictSet.has(stripped.toLowerCase())) return true;
    if (MODEL_LIKE_RE.test(tok) && /\d/.test(tok) && tok.length >= 2) return true;
    if (UNIT_RE.test(tok)) return true;
    if (LABEL_ABBR.has(stripped.toUpperCase())) return true;
    return false;
  }

  // Apply the hybrid classifier to one line: strip symbol noise, collapse
  // whitespace between CJK characters, then keep/drop each CJK run or ASCII
  // token per the rules above. Returns "" if nothing in the line survives.
  function filterLine(line, dictSet) {
    const lineDigitCount = (line.match(/\d/g) || []).length;
    let s = line.replace(SYMBOL_NOISE_RE, "");
    s = s.replace(CJK_SPACE_RE, "$1");
    const segments = s.match(CJK_SEGMENT_RE) || [];
    const kept = [];
    for (const seg of segments) {
      if (!seg) continue;
      if (isCjkChar(seg[0])) {
        if (seg.length >= 2 || cjkRunIsLexical(seg)) kept.push(seg);
      } else {
        const toks = seg.split(/\s+/).filter(Boolean);
        for (const t of toks) if (isKeepAsciiToken(t, dictSet, lineDigitCount)) kept.push(t);
      }
    }
    return kept.join(" ");
  }

  // Pure function: apply filterLine per line, preserving line order, drop
  // lines that end up empty. dictSet may be null (pattern-only mode).
  function filterTokens(text, dictSet) {
    if (!text) return "";
    const outLines = [];
    for (const line of text.split("\n")) {
      const f = filterLine(line, dictSet);
      if (f) outLines.push(f);
    }
    return outLines.join("\n");
  }

  // ---------------- Image loading (EXIF-aware) ----------------
  async function loadBitmap(blob) {
    if (typeof createImageBitmap === "function") {
      try { return await createImageBitmap(blob, { imageOrientation: "from-image" }); }
      catch (e) { /* fall back below */ }
      try { return await createImageBitmap(blob); }
      catch (e) { /* fall back below */ }
    }
    return await new Promise((res, rej) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("画像の読み込みに失敗しました")); };
      img.src = url;
    });
  }
  function dims(src) {
    return { w: src.width || src.naturalWidth, h: src.height || src.naturalHeight };
  }

  // Draw source into a canvas scaled so the longest side <= maxSide.
  function drawScaled(src, maxSide) {
    const { w, h } = dims(src);
    const scale = Math.min(1, maxSide / Math.max(w, h));
    const cw = Math.max(1, Math.round(w * scale));
    const ch = Math.max(1, Math.round(h * scale));
    const c = newCanvas(cw, ch);
    const ctx = c.getContext("2d");
    ctx.drawImage(src, 0, 0, cw, ch);
    return c;
  }

  function otsuThreshold(hist, total) {
    let sum = 0;
    for (let i = 0; i < 256; i++) sum += i * hist[i];
    let sumB = 0, wB = 0, max = 0, thr = 0;
    for (let i = 0; i < 256; i++) {
      wB += hist[i]; if (wB === 0) continue;
      const wF = total - wB; if (wF === 0) break;
      sumB += i * hist[i];
      const mB = sumB / wB, mF = (sum - sumB) / wF;
      const between = wB * wF * (mB - mF) * (mB - mF);
      if (between > max) { max = between; thr = i; }
    }
    return thr;
  }

  // Locate horizontal text bands in an image via a projection profile.
  // Returns [{y0,y1}] in the source's own pixel coordinates. Used to split a
  // crop (or a detected text box) into single lines for the rec path.
  function findTextBands(src) {
    const { w, h } = dims(src);
    const scale = Math.min(1, 1000 / Math.max(w, h));
    const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    const c = newCanvas(cw, ch);
    c.getContext("2d").drawImage(src, 0, 0, cw, ch);
    const d = c.getContext("2d").getImageData(0, 0, cw, ch).data;
    const n = cw * ch;
    const gray = new Uint8Array(n);
    const hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) {
      const y = (d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114) | 0;
      gray[i] = y; hist[y]++;
    }
    const t = otsuThreshold(hist, n);
    let dark = 0;
    for (let i = 0; i < n; i++) if (gray[i] < t) dark++;
    const textIsDark = dark <= n - dark; // text is usually the minority class
    const rowInk = new Uint32Array(ch);
    for (let y = 0; y < ch; y++) {
      let cnt = 0; const base = y * cw;
      for (let x = 0; x < cw; x++) {
        const isDark = gray[base + x] < t;
        if (textIsDark ? isDark : !isDark) cnt++;
      }
      rowInk[y] = cnt;
    }
    let maxInk = 0;
    for (let y = 0; y < ch; y++) if (rowInk[y] > maxInk) maxInk = rowInk[y];
    if (maxInk === 0) return [{ y0: 0, y1: h }];
    const gapAllow = Math.max(2, Math.round(ch * 0.02));
    const absFloor = Math.max(1, cw * 0.03);
    // Barcode robustness: an ultra-dense stripe block (e.g. a barcode) can
    // have rows far inkier than any real text line. If that single row were
    // allowed to set the relative bar below (12% of the strongest row), a
    // much sparser but still-legitimate text row right next to it -- e.g.
    // the human-readable digits printed under a barcode -- would fall below
    // the bar and never become its own band, silently dropping real text.
    // Fix: instead of the single strongest row in the whole image, use the
    // WEAKEST peak among the distinct row-ink "blocks" found via a loose
    // absolute floor -- i.e. let the sparsest plausible content block (not
    // the densest one) set the bar, so one dense block can't starve a
    // fainter block elsewhere. Blocks that never clear today's absolute
    // floor on their own (pure speckle) are excluded so they can't drag the
    // bar down to noise level. Falls back to maxInk (today's behavior) when
    // there's only one qualifying block (e.g. no barcode present).
    const looseFloor = Math.max(1, cw * 0.01);
    const blockPeaks = [];
    {
      let bStart = -1, bPeak = 0, bGap = 0;
      for (let y = 0; y < ch; y++) {
        if (rowInk[y] > looseFloor) {
          if (bStart < 0) { bStart = y; bPeak = 0; }
          if (rowInk[y] > bPeak) bPeak = rowInk[y];
          bGap = 0;
        } else if (bStart >= 0) {
          bGap++;
          if (bGap > gapAllow) {
            if (bPeak >= absFloor) blockPeaks.push(bPeak);
            bStart = -1; bPeak = 0; bGap = 0;
          }
        }
      }
      if (bStart >= 0 && bPeak >= absFloor) blockPeaks.push(bPeak);
    }
    const refInk = blockPeaks.length ? Math.min(...blockPeaks) : maxInk;
    // A row only counts as textual if it clears BOTH a relative bar (12% of
    // refInk) AND an absolute one (3% of the row width) -- the absolute
    // floor is what keeps noise-only crops (where refInk is itself just
    // speckle) from producing bands.
    const thr = Math.max(1, refInk * 0.12, absFloor);
    const raw = [];
    let start = -1, gap = 0;
    for (let y = 0; y < ch; y++) {
      if (rowInk[y] > thr) { if (start < 0) start = y; gap = 0; }
      else if (start >= 0) { gap++; if (gap > gapAllow) { raw.push([start, y - gap]); start = -1; gap = 0; } }
    }
    if (start >= 0) raw.push([start, ch - 1]);
    const out = [];
    const inv = 1 / scale;
    const minH = Math.max(6, ch * 0.02); // band height >= 6px at analysis scale
    for (const seg of raw) {
      const a = seg[0], b = seg[1];
      if (b - a < minH) continue;
      const pad = Math.round((b - a) * 0.25) + 2;
      const y0 = Math.max(0, a - pad), y1 = Math.min(ch - 1, b + pad);
      out.push({ y0: Math.round(y0 * inv), y1: Math.round((y1 + 1) * inv) });
    }
    return out.length ? out : [{ y0: 0, y1: h }];
  }

  // Extract the on-screen crop rectangle (fractions 0..1) as original-image pixels.
  function cropFromBitmap(bmp, r) {
    const { w, h } = dims(bmp);
    let sx = Math.round(r.x * w), sy = Math.round(r.y * h);
    let sw = Math.round(r.w * w), sh = Math.round(r.h * h);
    sx = clamp(sx, 0, w - 1); sy = clamp(sy, 0, h - 1);
    sw = clamp(sw, 1, w - sx); sh = clamp(sh, 1, h - sy);
    const c = newCanvas(sw, sh);
    c.getContext("2d").drawImage(bmp, sx, sy, sw, sh, 0, 0, sw, sh);
    return c;
  }

  // Return a drawable canvas for `src` (pass canvases through untouched).
  function toCanvas(src) {
    if (src && typeof src.getContext === "function") return src;
    const { w, h } = dims(src);
    const c = newCanvas(Math.max(1, w), Math.max(1, h));
    c.getContext("2d").drawImage(src, 0, 0);
    return c;
  }

  // ---------------- Perspective (台形) correction ----------------
  // Solve the 8-unknown DLT system mapping four src points -> four dst points
  // with plain Gauss-Jordan elimination. Returns the 3x3 homography flattened
  // as [h0..h8] with h8 == 1. No libraries.
  function solveHomography(src, dst) {
    const A = [], b = [];
    for (let i = 0; i < 4; i++) {
      const x = src[i].x, y = src[i].y, X = dst[i].x, Y = dst[i].y;
      A.push([x, y, 1, 0, 0, 0, -x * X, -y * X]); b.push(X);
      A.push([0, 0, 0, x, y, 1, -x * Y, -y * Y]); b.push(Y);
    }
    const n = 8;
    for (let col = 0; col < n; col++) {
      let piv = col;
      for (let r = col + 1; r < n; r++) if (Math.abs(A[r][col]) > Math.abs(A[piv][col])) piv = r;
      if (piv !== col) { const t = A[piv]; A[piv] = A[col]; A[col] = t; const tb = b[piv]; b[piv] = b[col]; b[col] = tb; }
      const pv = A[col][col];
      if (Math.abs(pv) < 1e-12) continue;
      for (let r = 0; r < n; r++) {
        if (r === col) continue;
        const f = A[r][col] / pv;
        if (f === 0) continue;
        for (let c = col; c < n; c++) A[r][c] -= f * A[col][c];
        b[r] -= f * b[col];
      }
    }
    const hh = new Array(9);
    for (let i = 0; i < n; i++) hh[i] = Math.abs(A[i][i]) < 1e-12 ? 0 : b[i] / A[i][i];
    hh[8] = 1;
    return hh;
  }

  // Warp the quad (corners as fractions of the image box: {tl,tr,br,bl})
  // to an upright rectangle via inverse-mapped bilinear sampling. Output
  // size = mean of the opposite edge lengths, clamped [16, 2000].
  function warpQuad(bmp, corners) {
    const { w: iw, h: ih } = dims(bmp);
    const P = {
      tl: { x: corners.tl.x * iw, y: corners.tl.y * ih },
      tr: { x: corners.tr.x * iw, y: corners.tr.y * ih },
      br: { x: corners.br.x * iw, y: corners.br.y * ih },
      bl: { x: corners.bl.x * iw, y: corners.bl.y * ih }
    };
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    let W = Math.round((dist(P.tl, P.tr) + dist(P.bl, P.br)) / 2);
    let H = Math.round((dist(P.tl, P.bl) + dist(P.tr, P.br)) / 2);
    W = clamp(W, 16, 2000); H = clamp(H, 16, 2000);
    // Source bounding box (keeps the sampled raster small on big photos).
    const xs = [P.tl.x, P.tr.x, P.br.x, P.bl.x], ys = [P.tl.y, P.tr.y, P.br.y, P.bl.y];
    const bx0 = clamp(Math.floor(Math.min.apply(null, xs)), 0, iw - 1);
    const by0 = clamp(Math.floor(Math.min.apply(null, ys)), 0, ih - 1);
    const bx1 = clamp(Math.ceil(Math.max.apply(null, xs)), 1, iw);
    const by1 = clamp(Math.ceil(Math.max.apply(null, ys)), 1, ih);
    const bw = Math.max(1, bx1 - bx0), bh = Math.max(1, by1 - by0);
    const srcC = newCanvas(bw, bh);
    srcC.getContext("2d").drawImage(bmp, bx0, by0, bw, bh, 0, 0, bw, bh);
    const sd = srcC.getContext("2d").getImageData(0, 0, bw, bh).data;
    const srcPts = [
      { x: P.tl.x - bx0, y: P.tl.y - by0 }, { x: P.tr.x - bx0, y: P.tr.y - by0 },
      { x: P.br.x - bx0, y: P.br.y - by0 }, { x: P.bl.x - bx0, y: P.bl.y - by0 }
    ];
    const dstPts = [{ x: 0, y: 0 }, { x: W, y: 0 }, { x: W, y: H }, { x: 0, y: H }];
    const Hi = solveHomography(dstPts, srcPts); // maps output pixel -> source pixel
    const out = newCanvas(W, H);
    const octx = out.getContext("2d");
    const oimg = octx.createImageData(W, H);
    const od = oimg.data;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const den = Hi[6] * x + Hi[7] * y + Hi[8];
        const sx = (Hi[0] * x + Hi[1] * y + Hi[2]) / den;
        const sy = (Hi[3] * x + Hi[4] * y + Hi[5]) / den;
        const oi = (y * W + x) * 4;
        if (sx < 0 || sy < 0 || sx > bw - 1 || sy > bh - 1) {
          od[oi] = od[oi + 1] = od[oi + 2] = 255; od[oi + 3] = 255; continue;
        }
        const x0 = sx | 0, y0 = sy | 0;
        const x1 = x0 + 1 < bw ? x0 + 1 : x0, y1 = y0 + 1 < bh ? y0 + 1 : y0;
        const fx = sx - x0, fy = sy - y0;
        for (let c = 0; c < 3; c++) {
          const p00 = sd[(y0 * bw + x0) * 4 + c], p10 = sd[(y0 * bw + x1) * 4 + c];
          const p01 = sd[(y1 * bw + x0) * 4 + c], p11 = sd[(y1 * bw + x1) * 4 + c];
          const a = p00 + (p10 - p00) * fx, b2 = p01 + (p11 - p01) * fx;
          od[oi + c] = a + (b2 - a) * fy;
        }
        od[oi + 3] = 255;
      }
    }
    octx.putImageData(oimg, 0, 0);
    return out;
  }

  // Best-effort quad auto-suggest inside the current rect region: downscale,
  // grayscale, Otsu, largest bright (label-like) connected region, then its
  // 4 extreme points (min/max of x+y and x-y). Returns corners as fractions
  // of the whole image box, or null if degenerate (<20% of rect area) / fails.
  function suggestQuad(bmp, rect) {
    const cropC = cropFromBitmap(bmp, rect);
    const { w: cw0, h: ch0 } = dims(cropC);
    const scale = Math.min(1, 240 / Math.max(cw0, ch0));
    const aw = Math.max(1, Math.round(cw0 * scale)), ah = Math.max(1, Math.round(ch0 * scale));
    if (aw < 8 || ah < 8) return null;
    const c = newCanvas(aw, ah);
    c.getContext("2d").drawImage(cropC, 0, 0, aw, ah);
    const d = c.getContext("2d").getImageData(0, 0, aw, ah).data;
    const n = aw * ah;
    const gray = new Uint8Array(n), hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) {
      const y = (d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114) | 0;
      gray[i] = y; hist[y]++;
    }
    const t = otsuThreshold(hist, n);
    const bright = new Uint8Array(n);
    for (let i = 0; i < n; i++) bright[i] = gray[i] >= t ? 1 : 0;
    const visited = new Uint8Array(n);
    const stack = new Int32Array(n);
    let bestComp = null, bestSize = 0;
    for (let s = 0; s < n; s++) {
      if (!bright[s] || visited[s]) continue;
      let sp = 0; stack[sp++] = s; visited[s] = 1; const comp = [s];
      while (sp > 0) {
        const idx = stack[--sp];
        const x = idx % aw, y = (idx / aw) | 0;
        if (x > 0) { const m = idx - 1; if (bright[m] && !visited[m]) { visited[m] = 1; stack[sp++] = m; comp.push(m); } }
        if (x < aw - 1) { const m = idx + 1; if (bright[m] && !visited[m]) { visited[m] = 1; stack[sp++] = m; comp.push(m); } }
        if (y > 0) { const m = idx - aw; if (bright[m] && !visited[m]) { visited[m] = 1; stack[sp++] = m; comp.push(m); } }
        if (y < ah - 1) { const m = idx + aw; if (bright[m] && !visited[m]) { visited[m] = 1; stack[sp++] = m; comp.push(m); } }
      }
      if (comp.length > bestSize) { bestSize = comp.length; bestComp = comp; }
    }
    if (!bestComp || bestSize < 16) return null;
    let maxSum = -1e9, minSum = 1e9, maxDiff = -1e9, minDiff = 1e9;
    let tl = null, br = null, tr = null, bl = null;
    for (const idx of bestComp) {
      const x = idx % aw, y = (idx / aw) | 0;
      const sum = x + y, diff = x - y;
      if (sum < minSum) { minSum = sum; tl = { x, y }; }
      if (sum > maxSum) { maxSum = sum; br = { x, y }; }
      if (diff > maxDiff) { maxDiff = diff; tr = { x, y }; }
      if (diff < minDiff) { minDiff = diff; bl = { x, y }; }
    }
    const poly = [tl, tr, br, bl];
    let A = 0;
    for (let i = 0; i < 4; i++) { const a = poly[i], b = poly[(i + 1) % 4]; A += a.x * b.y - b.x * a.y; }
    A = Math.abs(A) / 2;
    if (A < 0.2 * aw * ah) return null;
    const toFrac = (p) => ({ x: rect.x + (p.x / aw) * rect.w, y: rect.y + (p.y / ah) * rect.h });
    return { tl: toFrac(tl), tr: toFrac(tr), br: toFrac(br), bl: toFrac(bl) };
  }

  // ---------------- Automatic deskew (±12°) ----------------
  // Estimate the dominant text skew by maximizing the variance of the
  // horizontal row-projection profile under rotation, at a capped analysis
  // scale (~600px). Returns { angle, textIsDark }; `angle` is the correction
  // rotation to apply (degrees, canvas convention). Falls back to angle 0.
  function estimateSkew(src) {
    const { w, h } = dims(src);
    const scale = Math.min(1, 600 / Math.max(w, h));
    const aw = Math.max(1, Math.round(w * scale)), ah = Math.max(1, Math.round(h * scale));
    const c = newCanvas(aw, ah);
    c.getContext("2d").drawImage(src, 0, 0, aw, ah);
    const d = c.getContext("2d").getImageData(0, 0, aw, ah).data;
    const n = aw * ah;
    const gray = new Uint8Array(n), hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) {
      const y = (d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114) | 0;
      gray[i] = y; hist[y]++;
    }
    const t = otsuThreshold(hist, n);
    let dark = 0;
    for (let i = 0; i < n; i++) if (gray[i] < t) dark++;
    const textIsDark = dark <= n - dark;
    // Collect ink pixel coords (subsample if very dense).
    let xs = [], ys = [];
    for (let y = 0; y < ah; y++) for (let x = 0; x < aw; x++) {
      const isDark = gray[y * aw + x] < t;
      if (textIsDark ? isDark : !isDark) { xs.push(x); ys.push(y); }
    }
    let m = xs.length;
    if (m < 40) return { angle: 0, textIsDark };
    const CAP = 40000;
    if (m > CAP) {
      const step = Math.ceil(m / CAP);
      const nx = [], ny = [];
      for (let i = 0; i < m; i += step) { nx.push(xs[i]); ny.push(ys[i]); }
      xs = nx; ys = ny; m = xs.length;
    }
    const cx = aw / 2, cy = ah / 2;
    const off = Math.ceil(aw * Math.sin(12 * Math.PI / 180)) + 2;
    const rows = ah + 2 * off + 2;
    function variance(angleDeg) {
      const rad = angleDeg * Math.PI / 180, s = Math.sin(rad), co = Math.cos(rad);
      const prof = new Float64Array(rows);
      for (let i = 0; i < m; i++) {
        const xr = xs[i] - cx, yr = ys[i] - cy;
        const yy = (xr * s + yr * co) + cy + off;
        const bin = yy | 0;
        if (bin >= 0 && bin < rows) prof[bin]++;
      }
      let mean = 0;
      for (let i = 0; i < rows; i++) mean += prof[i];
      mean /= rows;
      let v = 0;
      for (let i = 0; i < rows; i++) { const dd = prof[i] - mean; v += dd * dd; }
      return v / rows;
    }
    let best = -1, bestA = 0;
    for (let a = -12; a <= 12; a += 1) { const v = variance(a); if (v > best) { best = v; bestA = a; } }
    for (let a = bestA - 1; a <= bestA + 1 + 1e-9; a += 0.5) {
      if (a < -12 || a > 12) continue;
      const v = variance(a); if (v > best) { best = v; bestA = a; }
    }
    return { angle: bestA, textIsDark };
  }

  // Rotate a canvas/bitmap by `deg` (canvas convention), expanding bounds so
  // nothing clips; fill background per polarity (white for dark text).
  function rotateCanvas(src, deg, bg) {
    const { w, h } = dims(src);
    const rad = deg * Math.PI / 180;
    const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
    const nw = Math.ceil(w * cos + h * sin), nh = Math.ceil(w * sin + h * cos);
    const c = newCanvas(nw, nh);
    const ctx = c.getContext("2d");
    ctx.fillStyle = bg || "#fff";
    ctx.fillRect(0, 0, nw, nh);
    ctx.translate(nw / 2, nh / 2);
    ctx.rotate(rad);
    ctx.drawImage(src, -w / 2, -h / 2);
    return c;
  }

  // Estimate + apply deskew. Skips (returns src canvas) when |angle| < 1°.
  function maybeDeskew(src) {
    let est;
    try { est = estimateSkew(src); }
    catch (e) { console.debug("deskew estimate failed:", e); return toCanvas(src); }
    const angle = est.angle;
    console.debug("deskew: chosen correction angle (deg) =", angle.toFixed(2));
    if (Math.abs(angle) < 1) return toCanvas(src);
    return rotateCanvas(src, angle, est.textIsDark ? "#fff" : "#000");
  }

  // Reasonably sized JPEG data URL for storage / preview.
  function toStorageDataUrl(src) {
    return drawScaled(src, 800).toDataURL("image/jpeg", 0.7);
  }

  // ---------------- PaddleOCR (onnxruntime-web) ----------------
  let ortScriptPromise = null;
  function loadOrt() {
    if (window.ort) return Promise.resolve(window.ort);
    if (ortScriptPromise) return ortScriptPromise;
    ortScriptPromise = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = ORT.script; s.async = true;
      s.onload = () => { window.ort ? res(window.ort) : rej(new Error("onnxruntime-web の初期化に失敗しました")); };
      s.onerror = () => { ortScriptPromise = null; rej(new Error("onnxruntime-web の読み込みに失敗しました")); };
      document.head.appendChild(s);
    });
    return ortScriptPromise;
  }

  // onnxruntime-web env is configured exactly once, the first time any model
  // is loaded (det or either rec model share the same wasm runtime).
  let ortEnvSet = false;
  async function ortReady(onStatus) {
    if (onStatus) onStatus("OCRエンジンを準備中…", 0.2);
    const ort = await loadOrt();
    if (!ortEnvSet) {
      ort.env.wasm.numThreads = 1;      // GitHub Pages: no COOP/COEP -> no SharedArrayBuffer
      ort.env.wasm.proxy = false;       // no proxy worker (keeps CSP simple)
      ort.env.wasm.simd = true;
      ort.env.wasm.wasmPaths = ORT.wasmDir;
      ortEnvSet = true;
    }
    return ort;
  }

  // Recognition sessions are cached per mode (eng: PP-OCRv4 ch+ASCII; jpn:
  // PP-OCRv3 japan). At most one live rec session besides the active one is
  // kept — switching mode releases the other to bound memory on phones.
  const recSessions = {};   // mode -> { session, dict }
  const recLoading = {};    // mode -> Promise
  async function getRec(mode, onStatus) {
    const key = REC_CFG[mode] ? mode : "eng";
    if (recSessions[key]) return recSessions[key];
    if (recLoading[key]) return recLoading[key];
    recLoading[key] = (async () => {
      const ort = await ortReady(onStatus);
      const cfg = REC_CFG[key];
      if (onStatus) onStatus("モデルを読み込み中…", 0.45);
      const [session, dictText] = await Promise.all([
        ort.InferenceSession.create(cfg.rec, { executionProviders: ["wasm"], graphOptimizationLevel: "all" }),
        fetch(cfg.dict).then((r) => { if (!r.ok) throw new Error("辞書ファイルの取得に失敗しました"); return r.text(); })
      ]);
      // PaddleOCR CTCLabelDecode: index 0 = blank, indices 1..N map to the
      // character list, which is the dict lines plus a trailing space
      // (use_space_char). Strip CR (the japan dict ships CRLF) and any trailing
      // blank line before appending, or the space entry would shift.
      const lines = dictText.replace(/\r/g, "").split("\n");
      while (lines.length && lines[lines.length - 1] === "") lines.pop();
      recSessions[key] = { session, dict: [...lines, " "] };
      return recSessions[key];
    })();
    try { return await recLoading[key]; }
    finally { recLoading[key] = null; }
  }
  function releaseSession(s) {
    try { if (s && s.session && s.session.release) s.session.release(); } catch (e) { /* ignore */ }
  }
  // Free every cached rec session for a mode other than `keep`.
  function releaseOtherRec(keep) {
    for (const m of Object.keys(recSessions)) {
      if (m !== keep) { releaseSession(recSessions[m]); delete recSessions[m]; }
    }
  }

  // Shared DBNet text detector (used by 「全体を読み取る」 in both modes).
  let detSession = null;
  let detLoading = null;
  async function getDet(onStatus) {
    if (detSession) return detSession;
    if (detLoading) return detLoading;
    detLoading = (async () => {
      const ort = await ortReady(onStatus);
      if (onStatus) onStatus("検出モデルを読み込み中…", 0.4);
      detSession = await ort.InferenceSession.create(PADDLE.det, { executionProviders: ["wasm"], graphOptimizationLevel: "all" });
      return detSession;
    })();
    try { return await detLoading; }
    finally { detLoading = null; }
  }

  function lineCanvasFrom(src, band) {
    const { w, h } = dims(src);
    const y0 = clamp(band.y0 | 0, 0, h - 1);
    const y1 = clamp(band.y1 | 0, y0 + 1, h);
    const bh = Math.max(1, y1 - y0);
    const c = newCanvas(w, bh);
    c.getContext("2d").drawImage(src, 0, y0, w, bh, 0, 0, w, bh);
    return c;
  }

  // Trim leading/trailing whitespace columns from a line canvas so recOne
  // resizes only the inked span to width x 48. Without this, a wide crop that
  // is mostly whitespace (e.g. 「全体を読み取る」 or an over-wide user crop)
  // compresses the text horizontally and the rec model can drop characters
  // (observed: the "z" of 50Hz). Pure geometry — Otsu polarity, same as
  // findTextBands. Returns the input unchanged if it finds no ink.
  function trimLineToInk(lineCanvas) {
    const { w: lw, h: lh } = dims(lineCanvas);
    const scale = Math.min(1, 1400 / lw);
    const aw = Math.max(1, Math.round(lw * scale)), ah = Math.max(1, Math.round(lh * scale));
    const ac = newCanvas(aw, ah);
    ac.getContext("2d").drawImage(lineCanvas, 0, 0, aw, ah);
    const d = ac.getContext("2d").getImageData(0, 0, aw, ah).data;
    const n = aw * ah;
    const gray = new Uint8Array(n), hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) {
      const y = (d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114) | 0;
      gray[i] = y; hist[y]++;
    }
    const t = otsuThreshold(hist, n);
    let dark = 0;
    for (let i = 0; i < n; i++) if (gray[i] < t) dark++;
    const textIsDark = dark <= n - dark;
    let minx = -1, maxx = -1;
    for (let x = 0; x < aw; x++) {
      let ink = false;
      for (let y = 0; y < ah; y++) { const isDark = gray[y * aw + x] < t; if (textIsDark ? isDark : !isDark) { ink = true; break; } }
      if (ink) { if (minx < 0) minx = x; maxx = x; }
    }
    if (minx < 0) return lineCanvas;
    const inv = 1 / scale;
    const pad = Math.max(1, Math.round(ah * 0.1 * inv));
    const x0 = clamp(Math.round(minx * inv) - pad, 0, lw - 1);
    const x1 = clamp(Math.round((maxx + 1) * inv) + pad, x0 + 1, lw);
    if (x0 === 0 && x1 === lw) return lineCanvas;
    return subCanvas(lineCanvas, { x0, y0: 0, x1, y1: lh });
  }

  // Word-level segmentation within one already-line-banded canvas: build a
  // column ink profile (grayscale + Otsu, same polarity logic as
  // findTextBands) and split on runs of empty columns wide enough to be
  // inter-word whitespace rather than intra-word letter spacing -- "as if a
  // human had drawn a box around each word". This is what lets
  // paddleRecognizeCrop (a) reject just a failing word (e.g. a barcode-stripe
  // segment next to real digits) instead of the whole line, and (b) recover
  // multi-word lines the CTC decoder doesn't reliably print a space within
  // (e.g. "MADE IN JAPAN" -> "MADEINJAPAN" on this rec model).
  //
  // Returns null when segmentation should be skipped and the caller should
  // run the whole line through recOne unchanged (today's behavior): either
  // only one ink block was found (nothing to split), or more than
  // WORD_MAX_SEGMENTS blocks were found (almost certainly a barcode or
  // texture, not real words -- let the whole-line score gate judge it
  // instead of paying for dozens of recOne calls).
  // Otherwise returns [{x0,x1,y0,y1}, ...] word boxes in the input canvas's
  // own pixel coordinates, y-tightened to each word's own ink rows (plus
  // ~15% padding all around, clamped to the canvas).
  // 英数字 splits on gaps >= 0.45x line height (normal inter-word spacing).
  // 日本語 uses a much LOOSER gap (>= 1.1x line height) so it only ever splits
  // on the wide spaces that separate distinct label fields (定格 / 100V / 50Hz /
  // 1.5A) — continuous Japanese (東京都千代田区1-2-3) has no such gaps and stays
  // whole. Splitting matters for jpn too: recognizing each field on its own
  // tightly-cropped canvas avoids the horizontal compression that drops
  // characters (e.g. the "z" of 50Hz) when a wide, mostly-whitespace line is
  // squeezed to width x 48 in one shot.
  const WORD_GAP_HEIGHT_RATIO = 0.45;
  const JPN_WORD_GAP_HEIGHT_RATIO = 1.1;
  const WORD_MAX_SEGMENTS = 24;
  function segmentWordsInLine(lineCanvas, gapRatio) {
    const ratio = gapRatio || WORD_GAP_HEIGHT_RATIO;
    const { w: lw, h: lh } = dims(lineCanvas);
    const scale = Math.min(1, 1400 / lw);
    const aw = Math.max(1, Math.round(lw * scale)), ah = Math.max(1, Math.round(lh * scale));
    const ac = newCanvas(aw, ah);
    ac.getContext("2d").drawImage(lineCanvas, 0, 0, aw, ah);
    const d = ac.getContext("2d").getImageData(0, 0, aw, ah).data;
    const n = aw * ah;
    const gray = new Uint8Array(n);
    const hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) {
      const y = (d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114) | 0;
      gray[i] = y; hist[y]++;
    }
    const t = otsuThreshold(hist, n);
    let dark = 0;
    for (let i = 0; i < n; i++) if (gray[i] < t) dark++;
    const textIsDark = dark <= n - dark;
    const colInk = new Uint32Array(aw);
    for (let x = 0; x < aw; x++) {
      let cnt = 0;
      for (let y = 0; y < ah; y++) {
        const isDark = gray[y * aw + x] < t;
        if (textIsDark ? isDark : !isDark) cnt++;
      }
      colInk[x] = cnt;
    }
    let maxCol = 0;
    for (let x = 0; x < aw; x++) if (colInk[x] > maxCol) maxCol = colInk[x];
    if (maxCol === 0) return null;

    const emptyFloor = Math.max(0, Math.round(maxCol * 0.05));
    const gapThreshold = Math.max(3, Math.round(ah * ratio));

    // Column run-length split: a run of empty columns >= gapThreshold starts
    // a new word segment; shorter gaps (letter spacing within a word) don't.
    const rawSegs = [];
    let segStart = -1, gapStart = -1, gapLen = 0;
    for (let x = 0; x < aw; x++) {
      const empty = colInk[x] <= emptyFloor;
      if (!empty) {
        if (segStart < 0) segStart = x;
        gapStart = -1; gapLen = 0;
      } else if (segStart >= 0) {
        if (gapStart < 0) gapStart = x;
        gapLen++;
        if (gapLen >= gapThreshold) {
          rawSegs.push([segStart, gapStart]);
          segStart = -1; gapStart = -1; gapLen = 0;
        }
      }
    }
    if (segStart >= 0) rawSegs.push([segStart, aw]);
    if (rawSegs.length <= 1 || rawSegs.length > WORD_MAX_SEGMENTS) return null;

    const inv = 1 / scale;
    const out = [];
    for (const [sx, ex] of rawSegs) {
      // Tighten the y-extent to this segment's own ink rows.
      let y0 = -1, y1 = -1;
      for (let y = 0; y < ah; y++) {
        let hasInk = false;
        for (let x = sx; x < ex; x++) {
          const isDark = gray[y * aw + x] < t;
          if (textIsDark ? isDark : !isDark) { hasInk = true; break; }
        }
        if (hasInk) { if (y0 < 0) y0 = y; y1 = y; }
      }
      if (y0 < 0) continue; // shouldn't happen (segment came from a nonzero colInk range)
      const segW = ex - sx, segH = y1 - y0 + 1;
      const padX = Math.max(1, Math.round(segW * 0.15));
      const padY = Math.max(1, Math.round(segH * 0.15));
      const ax0 = Math.max(0, sx - padX), ax1 = Math.min(aw, ex + padX);
      const ay0 = Math.max(0, y0 - padY), ay1 = Math.min(ah, y1 + 1 + padY);
      out.push({
        x0: clamp(Math.round(ax0 * inv), 0, lw - 1),
        x1: clamp(Math.round(ax1 * inv), 1, lw),
        y0: clamp(Math.round(ay0 * inv), 0, lh - 1),
        y1: clamp(Math.round(ay1 * inv), 1, lh)
      });
    }
    return out.length > 1 ? out : null;
  }

  // Resize a single-line image to height 48 (proportional width), build the
  // BGR CHW float tensor, run rec, CTC-greedy decode.
  // Returns { text, score }: score is the mean of the argmax probabilities
  // over the EMITTED steps only (non-blank, non-repeat) -- the same
  // definition PaddleOCR's own CTCLabelDecode uses to compute its confidence,
  // which upstream then thresholds at 0.5 to drop garbage. The rec model's
  // output is already post-softmax per timestep (each row sums to ~1, values
  // in [0,1] -- verified empirically by probing the ONNX output directly),
  // so the argmax values can be used as probabilities with no extra softmax.
  async function recOne(ort, session, dict, lineCanvas) {
    let w = Math.round(lineCanvas.width * REC_H / lineCanvas.height);
    w = clamp(w, 16, 2000);
    const c = newCanvas(w, REC_H);
    const ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(lineCanvas, 0, 0, w, REC_H);
    const d = ctx.getImageData(0, 0, w, REC_H).data;
    const n = w * REC_H;
    const input = new Float32Array(3 * n);
    for (let i = 0; i < n; i++) {
      const r = d[i * 4] / 255, g = d[i * 4 + 1] / 255, b = d[i * 4 + 2] / 255;
      input[i] = (b - 0.5) / 0.5;         // B plane
      input[n + i] = (g - 0.5) / 0.5;     // G plane
      input[2 * n + i] = (r - 0.5) / 0.5; // R plane
    }
    const tensor = new ort.Tensor("float32", input, [1, 3, REC_H, w]);
    const feeds = {}; feeds[session.inputNames[0]] = tensor;
    const out = await session.run(feeds);
    const o = out[session.outputNames[0]];
    const T = o.dims[1], C = o.dims[2], data = o.data;
    let prev = -1, s = "";
    let scoreSum = 0, scoreCount = 0;
    for (let t = 0; t < T; t++) {
      const base = t * C;
      let best = data[base], bi = 0;
      for (let ci = 1; ci < C; ci++) { const v = data[base + ci]; if (v > best) { best = v; bi = ci; } }
      if (bi !== 0 && bi !== prev) {
        const ch = dict[bi - 1];
        if (ch !== undefined) { s += ch; scoreSum += best; scoreCount++; }
      }
      prev = bi;
    }
    return { text: s.trim(), score: scoreCount ? scoreSum / scoreCount : 0 };
  }

  // Crop a sub-region (in a canvas's own pixel coordinates) into a new canvas.
  function subCanvas(src, box) {
    const w = Math.max(1, box.x1 - box.x0), h = Math.max(1, box.y1 - box.y0);
    const c = newCanvas(w, h);
    c.getContext("2d").drawImage(src, box.x0, box.y0, w, h, 0, 0, w, h);
    return c;
  }

  // ---------------- DBNet text detection (PP-OCRv4 det) ----------------
  // Group axis-aligned boxes into reading order: sort top-to-bottom, cluster
  // boxes whose vertical ranges overlap by >40% of the shorter box into rows,
  // then order each row left-to-right. Labels are roughly horizontal (upstream
  // deskew handles small tilt), so axis-aligned rows are sufficient.
  function groupReadingOrder(boxes) {
    if (boxes.length <= 1) return boxes;
    const sorted = boxes.slice().sort((a, b) => a.y0 - b.y0);
    const rows = [];
    for (const b of sorted) {
      let placed = false;
      for (const row of rows) {
        const ov = Math.min(row.y1, b.y1) - Math.max(row.y0, b.y0);
        const minH = Math.min(row.y1 - row.y0, b.y1 - b.y0);
        if (ov > 0.4 * minH) {
          row.items.push(b); row.y0 = Math.min(row.y0, b.y0); row.y1 = Math.max(row.y1, b.y1);
          placed = true; break;
        }
      }
      if (!placed) rows.push({ y0: b.y0, y1: b.y1, items: [b] });
    }
    rows.sort((a, b) => a.y0 - b.y0);
    const out = [];
    for (const row of rows) { row.items.sort((a, b) => a.x0 - b.x0); for (const it of row.items) out.push(it); }
    return out;
  }

  // Run DBNet on a whole image and return axis-aligned text boxes (original
  // pixel coordinates), in reading order. Post-process: resize long side <=960
  // (dims multiple of 32), ImageNet-normalize RGB, threshold the prob map at
  // 0.3, flood-fill 4-connected components, keep those with mean prob >= 0.5
  // and area >= DET_MIN_AREA, unclip outward, clamp, map back to the original.
  async function detectTextBoxes(ort, session, src) {
    const { w, h } = dims(src);
    const scale = Math.min(1, DET_MAX_SIDE / Math.max(w, h));
    const nw = Math.max(32, Math.round(Math.round(w * scale) / 32) * 32);
    const nh = Math.max(32, Math.round(Math.round(h * scale) / 32) * 32);
    const c = newCanvas(nw, nh);
    const ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(src, 0, 0, nw, nh);
    const d = ctx.getImageData(0, 0, nw, nh).data;
    const n = nw * nh;
    const input = new Float32Array(3 * n);
    for (let i = 0; i < n; i++) {
      input[i]         = (d[i * 4]     / 255 - DET_MEAN[0]) / DET_STD[0]; // R plane (RGB order)
      input[n + i]     = (d[i * 4 + 1] / 255 - DET_MEAN[1]) / DET_STD[1]; // G
      input[2 * n + i] = (d[i * 4 + 2] / 255 - DET_MEAN[2]) / DET_STD[2]; // B
    }
    const tensor = new ort.Tensor("float32", input, [1, 3, nh, nw]);
    const feeds = {}; feeds[session.inputNames[0]] = tensor;
    const out = await session.run(feeds);
    const prob = out[session.outputNames[0]].data; // [1,1,nh,nw]
    const mask = new Uint8Array(n);
    for (let i = 0; i < n; i++) mask[i] = prob[i] > DET_THRESH ? 1 : 0;
    const visited = new Uint8Array(n);
    const stack = new Int32Array(n);
    const fx = w / nw, fy = h / nh;
    const boxes = [];
    for (let start = 0; start < n; start++) {
      if (!mask[start] || visited[start]) continue;
      let sp = 0; stack[sp++] = start; visited[start] = 1;
      let minx = nw, maxx = 0, miny = nh, maxy = 0, cnt = 0, psum = 0;
      while (sp > 0) {
        const idx = stack[--sp];
        const x = idx % nw, y = (idx / nw) | 0;
        cnt++; psum += prob[idx];
        if (x < minx) minx = x; if (x > maxx) maxx = x;
        if (y < miny) miny = y; if (y > maxy) maxy = y;
        if (x > 0) { const m = idx - 1; if (mask[m] && !visited[m]) { visited[m] = 1; stack[sp++] = m; } }
        if (x < nw - 1) { const m = idx + 1; if (mask[m] && !visited[m]) { visited[m] = 1; stack[sp++] = m; } }
        if (y > 0) { const m = idx - nw; if (mask[m] && !visited[m]) { visited[m] = 1; stack[sp++] = m; } }
        if (y < nh - 1) { const m = idx + nw; if (mask[m] && !visited[m]) { visited[m] = 1; stack[sp++] = m; } }
      }
      const bw = maxx - minx + 1, bh = maxy - miny + 1;
      if (cnt < DET_MIN_AREA || bw < 3 || bh < 3) continue;
      const score = psum / cnt;
      if (score < DET_BOX_THRESH) continue;
      const per = 2 * (bw + bh);
      const dist = per ? cnt * DET_UNCLIP / per : 0;
      const x0 = clamp(Math.round((minx - dist) * fx), 0, w - 1);
      const y0 = clamp(Math.round((miny - dist) * fy), 0, h - 1);
      const x1 = clamp(Math.round((maxx + 1 + dist) * fx), x0 + 1, w);
      const y1 = clamp(Math.round((maxy + 1 + dist) * fy), y0 + 1, h);
      boxes.push({ x0, y0, x1, y1, score });
    }
    return groupReadingOrder(boxes);
  }

  // ---------------- Recognition over a crop ----------------
  // Recognize an already-isolated region (the on-screen crop, a de-warped quad,
  // or a single DBNet-detected box). Split into line bands, and — in 英数字
  // mode only — further split each band into per-word sub-images
  // (segmentWordsInLine, "as if a human had drawn a box around each word") so a
  // single failing word (e.g. a barcode stripe mis-banded next to real digits)
  // is dropped without taking the rest of the line down with it, and multi-word
  // lines survive even when this rec model glues them ("MADE IN JAPAN" ->
  // "MADEINJAPAN"). Every word/line is score-gated at 0.5 (PaddleOCR's own
  // garbage threshold).
  //
  // 英数字 (eng): the ch(+ASCII) rec model hallucinates CJK glyphs on noise, so
  // non-ASCII output is stripped here (this path is ASCII-only by design).
  // 日本語 (jpn): word-splitting uses a LOOSENED gap (only wide field gaps split;
  // continuous kana/kanji stays whole) and the ASCII strip is NOT applied
  // (kana/kanji must survive) — instead full-width ASCII/digits/dashes are
  // folded to half-width via normalizeWidth so addresses/model numbers read
  // back plain.
  async function paddleRecognizeCrop(cropCanvas, mode, onStatus, quiet) {
    const { session, dict } = await getRec(mode, onStatus);
    const ort = window.ort;
    const isEng = mode === "eng";
    if (onStatus && !quiet) onStatus("認識中…", 0.85);
    const bands = findTextBands(cropCanvas);
    const kept = [];
    for (let i = 0; i < bands.length; i++) {
      const lc = lineCanvasFrom(cropCanvas, bands[i]);
      const wordBoxes = segmentWordsInLine(lc, isEng ? WORD_GAP_HEIGHT_RATIO : JPN_WORD_GAP_HEIGHT_RATIO);
      const wordResults = [];
      if (!wordBoxes) {
        wordResults.push(await recOne(ort, session, dict, trimLineToInk(lc)));
      } else {
        for (const box of wordBoxes) {
          wordResults.push(await recOne(ort, session, dict, subCanvas(lc, box)));
        }
      }
      const keptWords = [];
      for (const { text, score } of wordResults) {
        if (!text || score < 0.5) continue;
        const cleaned = isEng
          ? text.replace(/[^\x00-\x7F]/g, "").replace(/[ \t]+/g, " ").trim()
          : normalizeWidth(text).replace(/[ \t]+/g, " ").trim();
        if (!cleaned) continue;
        keptWords.push({ text: cleaned, score });
      }
      if (!keptWords.length) continue;
      const lineScore = keptWords.reduce((a, k) => a + k.score, 0) / keptWords.length;
      kept.push({ text: keptWords.map((k) => k.text).join(" "), score: lineScore });
    }
    if (onStatus && !quiet) onStatus("完了", 1);
    if (!kept.length) return { text: "", score: null };
    const meanScore = kept.reduce((a, k) => a + k.score, 0) / kept.length;
    return { text: kept.map((k) => k.text).join("\n"), score: meanScore };
  }

  // ---------------- Full-image recognition (detection + rec) ----------------
  // 「全体を読み取る」: run DBNet to find every text box, then recognize each box
  // through the crop pipeline above and join in reading order. If detection
  // finds nothing, fall back to treating the whole image as one crop (never a
  // dead end).
  async function paddleRecognizeFull(src, mode, onStatus) {
    const det = await getDet(onStatus); // loads ORT (sets window.ort) if not yet ready
    const ort = window.ort;
    if (onStatus) onStatus("文字領域を検出中…", 0.6);
    const boxes = await detectTextBoxes(ort, det, src);
    if (!boxes.length) return await paddleRecognizeCrop(src, mode, onStatus);
    if (onStatus) onStatus("認識中…", 0.8);
    const parts = [], scores = [];
    for (const b of boxes) {
      const r = await paddleRecognizeCrop(subCanvas(src, b), mode, onStatus, true);
      if (r.text && r.text.trim()) { parts.push(r.text); if (r.score != null) scores.push(r.score); }
    }
    if (onStatus) onStatus("完了", 1);
    return {
      text: parts.join("\n"),
      score: scores.length ? scores.reduce((a, s) => a + s, 0) / scores.length : null
    };
  }

  // ---------------- Clipboard helpers ----------------
  async function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall through */ }
    }
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  // ========================================================
  const App = {
    setup() {
      // 'capture' = 撮影タブ(入力), 'ocr' = 認識機能(範囲選択→認識→結果、独立フロー、
      // メインタブとしては見せない), 'list' = 一覧タブ。
      const view = ref("capture");
      // 認識機能をどこから開いたか。'capture'=新規撮影(保存で新規レコード)、
      // 'list'=一覧からの再認識(保存で ocrTargetRec を上書き)。キャンセル先も
      // これで決まる(capture→撮影に破棄、list→一覧に戻る)。
      const ocrOrigin = ref("capture");
      const ocrTargetRec = ref(null);       // 再認識で上書きする対象レコード
      const ocrActive = ref(false);         // 認識機能をモーダル(ダイアログ)表示中か
      const toast = ref("");
      let toastTimer = null;
      function showToast(msg) {
        toast.value = msg;
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.value = ""; }, 1800);
      }

      // ---- capture state ----
      const ocrMode = ref((() => {
        try { return localStorage.getItem(LANG_MODE_KEY) === "jpn" ? "jpn" : "eng"; }
        catch (e) { return "eng"; }
      })());
      function setOcrMode(mode) {
        if (ocrMode.value === mode) return;
        ocrMode.value = mode;
        try { localStorage.setItem(LANG_MODE_KEY, mode); } catch (e) { /* ignore */ }
      }
      const stage = ref("input");           // 'input' | 'crop' | 'processing' | 'result'
      const captureErr = ref("");
      const previewUrl = ref("");           // data URL for preview (also stored)
      const ocrText = ref("");
      const ocrRawText = ref("");           // post-confidence-filter, pre-word-filter
      const ocrFilteredText = ref("");      // post-word-filter (単語フィルタ)
      const wordFilterOn = ref(loadWordFilterPref());
      const ocrConf = ref(null);
      const engineUsed = ref("");           // display label, e.g. "PaddleOCR (PP-OCRv4)"
      const progress = ref(0);
      const progStatus = ref("");
      const cropRect = ref({ x: 0.1, y: 0.35, w: 0.8, h: 0.3 });
      const cropMode = ref("rect");         // 'rect' | 'quad' (台形補正)
      const quadCorners = ref(null);        // {tl,tr,br,bl}, each {x,y} as image-box fractions
      const stageEl = ref(null);
      let currentBitmap = null;             // non-reactive
      // Natural size of the loaded image + a reactive viewport, so the crop
      // stage can be sized to a height-capped display box (see cropDisplay).
      const bitmapSize = ref(null);         // {w,h} natural pixels
      const viewport = ref({ w: window.innerWidth || 375, h: window.innerHeight || 600 });
      // Display box (px) for the crop stage: the image scaled to fit both the
      // card width and ~40% of the viewport height, keeping its aspect ratio so
      // the crop overlay's %-coordinates still map 1:1 onto the image. The
      // height cap is what keeps the recognition screen scroll-free on iPhone SE2.
      const cropDisplay = computed(() => {
        const b = bitmapSize.value;
        if (!b || !b.w || !b.h) return null;
        const appW = Math.min(viewport.value.w, 680);
        const maxW = Math.max(120, appW - 54);   // 主内容: main(12)+card(14)+境界 の左右
        // Cap the image to a fraction of the viewport height so a tall (portrait)
        // image can't force a scroll inside the recognition modal on iPhone SE2,
        // while staying large enough to crop comfortably.
        const maxH = Math.max(140, Math.round(viewport.value.h * 0.42));
        const scale = Math.min(maxW / b.w, maxH / b.h, 1);
        return { w: Math.round(b.w * scale), h: Math.round(b.h * scale) };
      });

      // ---- list state ----
      const records = ref([]);
      const listErr = ref("");
      const filterDate = ref(null);
      // 一覧の表示モード: 'calendar'=カレンダーのみ / 'day'=選択日のリスト /
      // 'all'=全日の日毎リスト。一覧に入るとまずカレンダーのみ。
      const listView = ref("calendar");
      const today = new Date();
      const calY = ref(today.getFullYear());
      const calM = ref(today.getMonth());   // 0-based

      async function refreshRecords() {
        try {
          const all = await dbAll();
          all.sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
          records.value = all;
          listErr.value = "";
        } catch (e) { listErr.value = "記録の読み込みに失敗しました: " + e.message; }
      }

      // ---- image input -> crop stage ----
      async function handleBlob(blob) {
        captureErr.value = "";
        if (!blob || (blob.type && blob.type.indexOf("image") !== 0)) {
          captureErr.value = "画像ファイルを選択してください。";
          return;
        }
        try {
          currentBitmap = await loadBitmap(blob);
          bitmapSize.value = { w: currentBitmap.width, h: currentBitmap.height };
          previewUrl.value = toStorageDataUrl(currentBitmap);
          cropRect.value = { x: 0.1, y: 0.35, w: 0.8, h: 0.3 };
          cropMode.value = "rect"; quadCorners.value = null;
          ocrText.value = ""; ocrRawText.value = ""; ocrFilteredText.value = "";
          ocrConf.value = null; engineUsed.value = "";
          // 撮影/選択/貼り付け→認識機能(モーダル)へ必ず遷移(範囲選択から)。
          stage.value = "crop";
          ocrActive.value = true;
        } catch (e) {
          captureErr.value = "画像の読み込みに失敗しました: " + (e && e.message ? e.message : e);
          stage.value = "input";
        }
      }

      function setStatus(msg, p) {
        progStatus.value = msg;
        if (typeof p === "number") progress.value = p;
      }

      // Runs the 単語フィルタ (word filter) on freshly recognized text and
      // decides what the textarea shows. cleanedRawText is the text AFTER the
      // PaddleOCR per-word/line score threshold -- this function only adds the
      // dictionary+pattern token classifier on top of that.
      async function applyWordFilterAndFinish(cleanedRawText) {
        ocrRawText.value = cleanedRawText;
        let dict = null;
        try { dict = await getWordSet(setStatus); } catch (e) { dict = null; }
        const filtered = filterTokens(cleanedRawText, dict);
        if (filtered && filtered.trim()) {
          ocrFilteredText.value = filtered;
        } else {
          // Never make results strictly worse: if the word filter removed
          // everything but there was real raw text, fall back to raw and
          // reflect that in the toggle for this result. This does not
          // overwrite the user's stored ON/OFF preference for next time.
          ocrFilteredText.value = cleanedRawText;
          if (cleanedRawText && cleanedRawText.trim()) wordFilterOn.value = false;
        }
        ocrText.value = wordFilterOn.value ? ocrFilteredText.value : ocrRawText.value;
      }

      function toggleWordFilter() {
        wordFilterOn.value = !wordFilterOn.value;
        try { localStorage.setItem(WORD_FILTER_KEY, wordFilterOn.value ? "1" : "0"); } catch (e) { /* ignore */ }
        ocrText.value = wordFilterOn.value ? ocrFilteredText.value : ocrRawText.value;
      }

      // ---- OCR pipeline ----
      // Everything runs on PaddleOCR (ONNX Runtime Web):
      //   cropped read  -> rec-only over the isolated region (eng or jpn model)
      //   全体を読み取る -> DBNet detection + rec over each detected box
      // If ORT or a model fails to load there is no Tesseract fallback anymore,
      // so surface a clear Japanese error instead of a silent dead end.
      async function runOcr(useCrop) {
        captureErr.value = "";
        stage.value = "processing";
        progress.value = 0.05; progStatus.value = "画像を準備中…";
        ocrText.value = ""; ocrRawText.value = ""; ocrFilteredText.value = "";
        ocrConf.value = null; engineUsed.value = "";
        wordFilterOn.value = loadWordFilterPref();
        const mode = ocrMode.value;
        try {
          releaseOtherRec(mode); // bound memory: drop the inactive mode's rec model
          let result;
          if (useCrop) {
            // Crop source: quad mode homography-warps to an upright rectangle
            // (perspective already corrected); rect mode auto-deskews the crop.
            const cropCanvas = (cropMode.value === "quad" && quadCorners.value)
              ? warpQuad(currentBitmap, quadCorners.value)
              : maybeDeskew(cropFromBitmap(currentBitmap, cropRect.value));
            result = await paddleRecognizeCrop(cropCanvas, mode, setStatus);
          } else {
            result = await paddleRecognizeFull(maybeDeskew(currentBitmap), mode, setStatus);
          }
          engineUsed.value = REC_CFG[mode] ? REC_CFG[mode].label : REC_CFG.eng.label;
          ocrConf.value = result.score != null ? Math.round(result.score * 100) : null;
          await applyWordFilterAndFinish(cleanText(result.text));
          stage.value = "result";
        } catch (e) {
          console.warn("OCR failed:", e);
          captureErr.value = "文字認識に失敗しました。通信環境をご確認のうえ、もう一度お試しください: "
            + (e && e.message ? e.message : e);
          stage.value = currentBitmap ? "crop" : "input";
        }
      }

      // Start a fresh recognition session (新規撮影): save will create a new
      // calendar record. Used by camera/file/clipboard entry points.
      function beginCaptureSession() {
        ocrOrigin.value = "capture";
        ocrTargetRec.value = null;
      }

      function onFileInput(ev) {
        const f = ev.target.files && ev.target.files[0];
        ev.target.value = "";
        if (f) { beginCaptureSession(); handleBlob(f); }
      }

      async function pasteFromClipboard() {
        captureErr.value = "";
        if (!navigator.clipboard || !navigator.clipboard.read) {
          captureErr.value = "このブラウザではクリップボードからの読み取りに対応していません。画像を貼り付ける (Ctrl/Cmd+V) か、他のボタンをご利用ください。";
          return;
        }
        try {
          const items = await navigator.clipboard.read();
          for (const it of items) {
            const type = it.types.find((t) => t.indexOf("image") === 0);
            if (type) { const blob = await it.getType(type); beginCaptureSession(); await handleBlob(blob); return; }
          }
          captureErr.value = "クリップボードに画像が見つかりませんでした。";
        } catch (e) {
          captureErr.value = "クリップボードの読み取りが拒否されました: " + (e && e.message ? e.message : e);
        }
      }

      function onPaste(ev) {
        if (!ev.clipboardData) return;
        const items = ev.clipboardData.items || [];
        for (const it of items) {
          if (it.kind === "file" && it.type.indexOf("image") === 0) {
            const blob = it.getAsFile();
            if (blob) { ev.preventDefault(); beginCaptureSession(); handleBlob(blob); return; }
          }
        }
      }

      // ---- crop overlay drag/resize (pointer events: touch + mouse) ----
      let dragState = null;
      function onCropDown(mode, ev) {
        if (!stageEl.value) return;
        ev.preventDefault(); ev.stopPropagation();
        const rect = stageEl.value.getBoundingClientRect();
