        dragState = { mode, rect, startX: ev.clientX, startY: ev.clientY, orig: Object.assign({}, cropRect.value) };
        window.addEventListener("pointermove", onCropMove);
        window.addEventListener("pointerup", onCropUp);
        window.addEventListener("pointercancel", onCropUp);
      }
      function onCropMove(ev) {
        if (!dragState) return;
        const { mode, rect, startX, startY, orig } = dragState;
        const dx = rect.width ? (ev.clientX - startX) / rect.width : 0;
        const dy = rect.height ? (ev.clientY - startY) / rect.height : 0;
        const MIN = 0.05;
        let x = orig.x, y = orig.y, w = orig.w, h = orig.h;
        if (mode === "move") {
          x = clamp(orig.x + dx, 0, 1 - orig.w);
          y = clamp(orig.y + dy, 0, 1 - orig.h);
        } else {
          if (mode.indexOf("w") >= 0) { const nx = clamp(orig.x + dx, 0, orig.x + orig.w - MIN); w = orig.w + (orig.x - nx); x = nx; }
          if (mode.indexOf("e") >= 0) { w = clamp(orig.w + dx, MIN, 1 - orig.x); }
          if (mode.indexOf("n") >= 0) { const ny = clamp(orig.y + dy, 0, orig.y + orig.h - MIN); h = orig.h + (orig.y - ny); y = ny; }
          if (mode.indexOf("s") >= 0) { h = clamp(orig.h + dy, MIN, 1 - orig.y); }
        }
        cropRect.value = { x, y, w, h };
      }
      function onCropUp() {
        dragState = null;
        window.removeEventListener("pointermove", onCropMove);
        window.removeEventListener("pointerup", onCropUp);
        window.removeEventListener("pointercancel", onCropUp);
      }

      // ---- quad (台形補正) mode: default corners from the rect, auto-suggest ----
      function rectToQuad(r) {
        return {
          tl: { x: r.x, y: r.y }, tr: { x: r.x + r.w, y: r.y },
          br: { x: r.x + r.w, y: r.y + r.h }, bl: { x: r.x, y: r.y + r.h }
        };
      }
      function setCropMode(mode) {
        if (cropMode.value === mode) return;
        cropMode.value = mode;
        if (mode === "quad") {
          let q = rectToQuad(cropRect.value);
          try {
            const suggested = currentBitmap && suggestQuad(currentBitmap, cropRect.value);
            if (suggested) q = suggested;
          } catch (e) { console.debug("quad auto-suggest failed:", e); }
          quadCorners.value = q;
        }
      }
      let quadDrag = null;
      function onQuadDown(key, ev) {
        if (!stageEl.value || !quadCorners.value) return;
        ev.preventDefault(); ev.stopPropagation();
        const rect = stageEl.value.getBoundingClientRect();
        quadDrag = { key, rect, startX: ev.clientX, startY: ev.clientY, orig: Object.assign({}, quadCorners.value[key]) };
        window.addEventListener("pointermove", onQuadMove);
        window.addEventListener("pointerup", onQuadUp);
        window.addEventListener("pointercancel", onQuadUp);
      }
      function onQuadMove(ev) {
        if (!quadDrag) return;
        const { key, rect, startX, startY, orig } = quadDrag;
        const dx = rect.width ? (ev.clientX - startX) / rect.width : 0;
        const dy = rect.height ? (ev.clientY - startY) / rect.height : 0;
        const next = Object.assign({}, quadCorners.value);
        next[key] = { x: clamp(orig.x + dx, 0, 1), y: clamp(orig.y + dy, 0, 1) };
        quadCorners.value = next;
      }
      function onQuadUp() {
        quadDrag = null;
        window.removeEventListener("pointermove", onQuadMove);
        window.removeEventListener("pointerup", onQuadUp);
        window.removeEventListener("pointercancel", onQuadUp);
      }

      async function saveRecord() {
        try {
          const target = ocrTargetRec.value;
          let landedKey;
          if (target) {
            // 一覧からの再認識: 同じレコードを上書き。id/createdAt/dateKey と
            // 元画像はそのまま保持し、テキストだけ差し替える(カレンダーに
            // 新規エントリを増やさない)。
            await dbPut(Object.assign({}, target, { text: ocrText.value }));
            landedKey = target.dateKey;
          } else {
            const now = new Date();
            landedKey = localDateKey(now);
            await dbPut({
              id: (now.getTime() + "-" + Math.random().toString(36).slice(2, 8)),
              createdAt: now.toISOString(),
              dateKey: landedKey,
              text: ocrText.value,
              imageDataUrl: previewUrl.value
            });
          }
          await refreshRecords();
          resetOcrState();
          ocrTargetRec.value = null;
          ocrActive.value = false;
          showToast(target ? "更新しました" : "保存しました");
          // 保存直後は該当日のリスト(その記録が見える)を表示。
          view.value = "list";
          listView.value = "day";
          filterDate.value = landedKey;
        } catch (e) {
          captureErr.value = "保存に失敗しました: " + (e && e.message ? e.message : e);
        }
      }

      // Clear the recognition-flow scratch state (does not navigate).
      function resetOcrState() {
        stage.value = "input";
        previewUrl.value = ""; ocrText.value = ""; ocrRawText.value = ""; ocrFilteredText.value = "";
        ocrConf.value = null; engineUsed.value = ""; captureErr.value = "";
        progress.value = 0; progStatus.value = ""; currentBitmap = null;
      }
      // キャンセル: 認識機能を抜けて開いた場所へ戻る。撮影由来は撮影入力へ
      // 破棄、一覧由来は一覧へ戻る(対象レコードは無変更)。
      function cancelOcr() {
        resetOcrState();
        const origin = ocrOrigin.value;
        ocrTargetRec.value = null;
        ocrActive.value = false;
        view.value = origin === "list" ? "list" : "capture";
      }
      function backToCrop() {
        if (!currentBitmap) { cancelOcr(); return; }
        captureErr.value = "";
        stage.value = "crop";
      }

      async function deleteRecord(rec) {
        if (!window.confirm("この記録を削除しますか？")) return;
        try { await dbDelete(rec.id); await refreshRecords(); showToast("削除しました"); }
        catch (e) { listErr.value = "削除に失敗しました: " + e.message; }
      }

      async function copyRecord(rec) {
        const ok = await copyText(rec.text);
        showToast(ok ? "コピーしました" : "コピーに失敗しました");
      }

      // ---- inline record text editing ----
      // Only one record can be in edit mode at a time: editingId is a single
      // ref, so opening 編集 on another record just overwrites it (and
      // editText with it), discarding whatever was unsaved in the previous one.
      const editingId = ref(null);
      const editText = ref("");
      function startEdit(rec) {
        editingId.value = rec.id;
        editText.value = rec.text || "";
      }
      function cancelEdit() {
        editingId.value = null;
        editText.value = "";
      }
      async function saveEdit(rec) {
        try {
          // Same id -- do not touch createdAt/dateKey, only the text changes.
          await dbPut(Object.assign({}, rec, { text: editText.value }));
          await refreshRecords();
          editingId.value = null;
          editText.value = "";
          showToast("更新しました");
        } catch (e) {
          listErr.value = "更新に失敗しました: " + (e && e.message ? e.message : e);
        }
      }

      // ---- lightbox & re-OCR from a saved record ----
      const lightboxUrl = ref("");

      // Saved images are the <=800px storage JPEGs, so a re-run works from
      // that resolution (not the original camera photo).
      async function reOcrRecord(rec) {
        try {
          const blob = await (await fetch(rec.imageDataUrl)).blob();
          // 一覧からの再認識: 保存時にこのレコードを上書きする。handleBlob が
          // 認識機能(view='ocr')へ遷移する。元画像は保持するため previewUrl の
          // 再エンコード版ではなく rec.imageDataUrl を上書き対象に残す。
          ocrOrigin.value = "list";
          ocrTargetRec.value = rec;
          await handleBlob(blob);
        } catch (e) {
          showToast("画像の読み込みに失敗しました");
        }
      }

      // ---- calendar / grouping ----
      const countsByDate = computed(() => {
        const m = {};
        for (const r of records.value) m[r.dateKey] = (m[r.dateKey] || 0) + 1;
        return m;
      });
      const visibleGroups = computed(() => {
        const groups = {};
        for (const r of records.value) {
          if (filterDate.value && r.dateKey !== filterDate.value) continue;
          (groups[r.dateKey] = groups[r.dateKey] || []).push(r);
        }
        return Object.keys(groups).sort().reverse().map((k) => ({ key: k, items: groups[k] }));
      });
      const calCells = computed(() => {
        const y = calY.value, m = calM.value;
        const first = new Date(y, m, 1).getDay();
        const days = new Date(y, m + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < first; i++) cells.push(null);
        for (let d = 1; d <= days; d++) cells.push(y + "-" + pad2(m + 1) + "-" + pad2(d));
        return cells;
      });
      function prevMonth() { if (calM.value === 0) { calM.value = 11; calY.value--; } else calM.value--; }
      function nextMonth() { if (calM.value === 11) { calM.value = 0; calY.value++; } else calM.value++; }

      onMounted(() => {
        refreshRecords();
        window.addEventListener("paste", onPaste);
        window.addEventListener("resize", () => {
          viewport.value = { w: window.innerWidth || 375, h: window.innerHeight || 600 };
        });
      });

      // ---------------- render helpers ----------------
      function fileButton(labelText, capture) {
        const attrs = { type: "file", accept: "image/*", class: "hidden-file", onChange: onFileInput };
        if (capture) attrs.capture = "environment";
        return h("label", { class: "btn" + (capture ? "" : " sec") + " filebtn" }, [
          h("input", attrs), labelText
        ]);
      }

      function renderProcessing() {
        return h("div", { class: "card" }, [
          h("div", { class: "progwrap" }, [
            h("div", { class: "progbar" }, [
              h("div", { class: "progfill", style: { width: Math.round(progress.value * 100) + "%" } })
            ]),
            h("div", { class: "progtxt" }, progStatus.value + " " + Math.round(progress.value * 100) + "%")
          ]),
          previewUrl.value ? h("img", { class: "preview", src: previewUrl.value, alt: "" }) : null
        ]);
      }

      function quadOverlay() {
        const q = quadCorners.value;
        if (!q) return null;
        const pts = [q.tl, q.tr, q.br, q.bl].map((p) => (p.x * 100) + "," + (p.y * 100)).join(" ");
        const handle = (key) => h("div", {
          class: "crop-handle qh qh-" + key, key: key,
          style: { left: (q[key].x * 100) + "%", top: (q[key].y * 100) + "%" },
          onPointerdown: (e) => onQuadDown(key, e)
        });
        return [
          h("svg", { class: "quad-svg", viewBox: "0 0 100 100", preserveAspectRatio: "none" }, [
            h("polygon", {
              points: pts, fill: "rgba(76,141,255,0.14)", stroke: "#4c8dff",
              "stroke-width": "2", "vector-effect": "non-scaling-stroke"
            })
          ]),
          handle("tl"), handle("tr"), handle("br"), handle("bl")
        ];
      }
      function renderCrop() {
        const r = cropRect.value;
        const box = {
          left: (r.x * 100) + "%", top: (r.y * 100) + "%",
          width: (r.w * 100) + "%", height: (r.h * 100) + "%"
        };
        const isQuad = cropMode.value === "quad";
        const disp = cropDisplay.value;
        const stageStyle = disp ? { width: disp.w + "px", height: disp.h + "px" } : null;
        return h("div", {}, [
          captureErr.value ? h("div", { class: "err" }, captureErr.value) : null,
          h("div", { class: "card" }, [
            // 認識モードはここ(認識機能)で選ぶ。撮影前ではなく読み取り直前に
            // 選べるので、同じ画像を英数字/日本語で読み比べるのも容易。
            h("div", { class: "cropctl" }, [
              h("div", { class: "segctl" }, [
                h("button", { class: ocrMode.value === "eng" ? "on" : "", onClick: () => setOcrMode("eng") }, "英数字"),
                h("button", { class: ocrMode.value === "jpn" ? "on" : "", onClick: () => setOcrMode("jpn") }, "日本語")
              ]),
              h("div", { class: "segctl" }, [
                h("button", { class: isQuad ? "" : "on", onClick: () => setCropMode("rect") }, "矩形"),
                h("button", { class: isQuad ? "on" : "", onClick: () => setCropMode("quad") }, "台形補正")
              ])
            ]),
            h("div", { class: "crop-stage", ref: stageEl, style: stageStyle }, [
              h("img", { class: "crop-img", src: previewUrl.value, alt: "撮影した画像" }),
              isQuad
                ? quadOverlay()
                : h("div", { class: "crop-overlay", style: box, onPointerdown: (e) => onCropDown("move", e) }, [
                    h("div", { class: "crop-handle nw", onPointerdown: (e) => onCropDown("nw", e) }),
                    h("div", { class: "crop-handle ne", onPointerdown: (e) => onCropDown("ne", e) }),
                    h("div", { class: "crop-handle sw", onPointerdown: (e) => onCropDown("sw", e) }),
                    h("div", { class: "crop-handle se", onPointerdown: (e) => onCropDown("se", e) })
                  ])
            ]),
            h("div", { class: "hint" }, isQuad
              ? "四隅をラベルの角に合わせます。"
              : "読みたい行だけを枠で囲むと精度が上がります。"),
            // 指定範囲 / 全体読取 / キャンセル(やり直す) を横1列に。
            h("div", { class: "btn-row triple", style: { marginTop: "10px" } }, [
              h("button", { class: "btn", onClick: () => runOcr(true) }, "指定範囲"),
              h("button", { class: "btn sec", onClick: () => runOcr(false) }, "全体読取"),
              h("button", { class: "btn sec", onClick: cancelOcr },
                ocrOrigin.value === "list" ? "キャンセル" : "やり直す")
            ])
          ])
        ]);
      }

      function renderResult() {
        const engineName = engineUsed.value || "PaddleOCR";
        const overwrite = !!ocrTargetRec.value;
        return h("div", { class: "ocrscreen" }, [
          captureErr.value ? h("div", { class: "err" }, captureErr.value) : null,
          h("div", { class: "card resultcard" }, [
            h("h2", { class: "sec" }, overwrite ? "認識結果 — 上書き保存しますか？" : "認識結果 — 保存しますか？"),
            h("img", { class: "preview compact", src: previewUrl.value, alt: "撮影した画像" }),
            h("div", { class: "engine" }, [
              "エンジン: ", h("b", {}, engineName),
              ocrConf.value != null ? "　信頼度 " + ocrConf.value + "%" : ""
            ]),
            h("div", { class: "wfrow" }, [
              h("span", { class: "wflabel" }, "単語フィルタ"),
              h("button", {
                class: "wftoggle" + (wordFilterOn.value ? " on" : ""),
                onClick: toggleWordFilter
              }, wordFilterOn.value ? "ON" : "OFF")
            ]),
            h("textarea", {
              value: ocrText.value,
              onInput: (e) => { ocrText.value = e.target.value; },
              spellcheck: "false"
            }),
            // 保存する stands alone as the single, full-width primary action.
            // 破棄/範囲を選び直す are a secondary pair on their own row below --
            // deliberately not beside 保存する, so a mis-tap can't hit save
            // when the user meant to discard (or vice versa).
            h("div", { class: "btn-row", style: { marginTop: "14px" } }, [
              h("button", { class: "btn ok", onClick: saveRecord }, overwrite ? "上書き保存" : "保存する")
            ]),
            h("div", { class: "btn-row", style: { marginTop: "10px" } }, [
              h("button", { class: "btn sec", onClick: backToCrop }, "範囲を選び直す"),
              h("button", { class: "btn sec", onClick: cancelOcr },
                overwrite ? "キャンセル" : "破棄")
            ])
          ])
        ]);
      }

      function renderInput() {
        // 認識モード選択は撮影画面ではなく、撮影後の認識画面(renderCrop)へ移動。
        // ここは入力手段だけに絞る(SE2 でも縦スクロール不要な軽い画面)。
        return h("div", {}, [
          captureErr.value ? h("div", { class: "err" }, captureErr.value) : null,
          h("div", { class: "card" }, [
            h("h2", { class: "sec" }, "ラベルを撮影・選択"),
            fileButton("カメラで撮影", true),
            h("div", { style: { height: "10px" } }),
            fileButton("画像を選択", false),
            h("div", { style: { height: "10px" } }),
            h("button", { class: "btn sec", onClick: pasteFromClipboard }, "クリップボードから貼り付け"),
            h("details", { class: "acc" }, [
              h("summary", {}, "モードと撮影のコツ"),
              h("div", { class: "hint" }, "読み取りは撮影後の画面で「英数字」か「日本語」を選べます。英数字は型番・製造番号向け（PP-OCRv4）、日本語は住所・品名など和文向け（PP-OCRv3 japan。住所の 1-2-3 など半角数字もそのまま）。初回のみモデル（合計 約22MB）をダウンロードします。ラベルは大きく明るく撮影し、読みたい行だけを枠で囲むと精度が上がります。斜めなら台形補正で四隅を合わせます（傾きは自動補正）。画像をコピーして Ctrl/Cmd+V でも貼り付けできます。")
            ])
          ])
        ]);
      }

      // 認識機能の中身(範囲選択→認識中→結果)。モーダル内に描画する。
      function renderOcrBody() {
        if (stage.value === "processing") return renderProcessing();
        if (stage.value === "result") return renderResult();
        return renderCrop();
      }
      // 認識機能はメインタブ(撮影/一覧)を持たない独立モーダル(ダイアログ)。
      // ✕ はキャンセル(入口へ戻る)。
      function renderOcrModal() {
        const title = ocrTargetRec.value ? "再読み取り" : "読み取り";
        return h("div", { class: "ocr-modal" }, [
          h("div", { class: "modalbar" }, [
            h("span", { class: "mtitle" }, title),
            h("button", { class: "modalclose", onClick: cancelOcr, "aria-label": "閉じる" }, "✕")
          ]),
          h("div", { class: "modalbody" }, renderOcrBody())
        ]);
      }

      function renderRecord(rec) {
        const isEditing = editingId.value === rec.id;
        // In edit mode the other actions (コピー/再読み取り/削除) are not
        // rendered at all -- simplest way to guarantee no mis-taps while a
        // save/cancel decision is pending on this card.
        const bodyRest = isEditing
          ? [
              h("textarea", {
                value: editText.value,
                onInput: (e) => { editText.value = e.target.value; },
                spellcheck: "false"
              }),
              h("div", { class: "editrow" }, [
                h("button", { class: "save", onClick: () => saveEdit(rec) }, "保存"),
                h("button", { class: "cancel", onClick: cancelEdit }, "キャンセル")
              ])
            ]
          : [
              h("div", { class: "txt" }, rec.text || "(テキストなし)"),
              h("div", { class: "acts" }, [
                h("div", { class: "actrow" }, [
                  h("button", { onClick: () => copyRecord(rec) }, "コピー"),
                  h("button", { onClick: () => reOcrRecord(rec) }, "再読み取り")
                ]),
                h("div", { class: "actrow" }, [
                  h("button", { onClick: () => startEdit(rec) }, "編集"),
                  h("button", { class: "del", onClick: () => deleteRecord(rec) }, "削除")
                ])
              ])
            ];
        return h("div", { class: "rec", key: rec.id }, [
          h("img", {
            class: "thumb", src: rec.imageDataUrl, alt: "保存した画像(タップで拡大)",
            onClick: () => { lightboxUrl.value = rec.imageDataUrl; }
          }),
          h("div", { class: "body" }, [
            h("div", { class: "time" }, timeLabel(rec.createdAt)),
            ...bodyRest
          ])
        ]);
      }

      function renderCalendar() {
        const dow = ["日", "月", "火", "水", "木", "金", "土"];
        return h("div", { class: "cal" }, [
          h("div", { class: "calhead" }, [
            h("button", { class: "calnav", onClick: prevMonth, "aria-label": "前の月" }, "‹"),
            h("div", { class: "mlabel" }, calY.value + "年 " + (calM.value + 1) + "月"),
            h("button", { class: "calnav", onClick: nextMonth, "aria-label": "次の月" }, "›")
          ]),
          h("div", { class: "calgrid" }, [
            ...dow.map((d) => h("div", { class: "caldow", key: "dow" + d }, d)),
            ...calCells.value.map((key, i) => {
              if (!key) return h("div", { class: "calcell empty", key: "e" + i });
              const cnt = countsByDate.value[key] || 0;
              const cls = "calcell" + (cnt ? " has" : "") + (filterDate.value === key ? " sel" : "");
              const day = +key.split("-")[2];
              return h("div", {
                class: cls, key: key,
                onClick: () => { if (cnt) { filterDate.value = key; listView.value = "day"; } }
              }, [
                String(day),
                cnt ? h("span", { class: "caldot" }, String(cnt)) : null
              ]);
            })
          ])
        ]);
      }

      function toCalendar() { listView.value = "calendar"; filterDate.value = null; }
      function showAllDays() { listView.value = "all"; filterDate.value = null; }

      function renderGroups(groups) {
        return groups.length === 0
          ? h("div", { class: "empty-note" }, "保存された記録はありません。")
          : groups.map((g) =>
              h("div", { key: g.key }, [
                h("div", { class: "datehdr", style: { marginTop: "0" } }, dateHeaderLabel(g.key)),
                ...g.items.map(renderRecord)
              ]));
      }

      function renderList() {
        const err = listErr.value ? h("div", { class: "err" }, listErr.value) : null;
        // カレンダーのみ画面。日をタップするとその日のリストへ。
        if (listView.value === "calendar") {
          return h("div", {}, [err, renderCalendar()]);
        }
        // 'day'(filterDate で1日に絞り込み) / 'all'(filterDate=null で全日)。
        // visibleGroups が filterDate に応じて絞り込み済み。
        return h("div", {}, [
          err,
          h("div", { class: "listbar" }, [
            h("button", { class: "btn sec", onClick: toCalendar }, "‹ カレンダー"),
            listView.value === "day"
              ? h("button", { class: "btn sec", onClick: showAllDays }, "日毎リストのみ")
              : null
          ]),
          renderGroups(visibleGroups.value)
        ]);
      }

      // メインタブは撮影/一覧の2つ。認識機能は独立モーダルなのでタブに出さない。
      function goTab(tab) {
        view.value = tab;
        if (tab === "list") { listView.value = "calendar"; filterDate.value = null; refreshRecords(); }
      }

      return () => h("div", { class: "shell" }, [
        h("header", {}, [
          h("h1", {}, ["ラベルOCR", h("span", { class: "ver" }, APP_VERSION)]),
          h("div", { class: "nav" }, [
            h("button", { class: view.value === "capture" ? "active" : "", onClick: () => goTab("capture") }, "撮影"),
            h("button", { class: view.value === "list" ? "active" : "", onClick: () => goTab("list") }, "一覧")
          ])
        ]),
        h("main", {}, view.value === "capture" ? renderInput() : renderList()),
        ocrActive.value ? renderOcrModal() : null,
        lightboxUrl.value
          ? h("div", { class: "lightbox", onClick: () => { lightboxUrl.value = ""; } }, [
              h("img", { src: lightboxUrl.value, alt: "保存した画像" }),
              h("button", { class: "lightbox-close", "aria-label": "閉じる" }, "✕")
            ])
          : null,
        toast.value ? h("div", { class: "toast" }, toast.value) : null
      ]);
    }
  };

  createApp(App).mount("#app");
})();
</script>
