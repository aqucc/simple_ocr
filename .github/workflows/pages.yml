name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/wasm-ocr-browser-app-to2ll3"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true — Pages が未設定なら自動で有効化を試みる
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 公開するのはアプリ本体と自己ホストの japan モデルのみ
      # （tools/ や README は含めない）
      - name: Stage site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r models _site/models
          # PWA assets (manifest / service worker / home-screen icons)
          cp manifest.webmanifest _site/
          cp sw.js _site/
          cp -r icons _site/icons
          # デプロイ版のみバージョンを埋め込む（インラインscript/styleの中身は
          # 変更しないので CSP の sha256 ハッシュには影響しない）
          sed -i "s|<title>|<meta name=\"app-version\" content=\"${GITHUB_SHA:0:7}\"><title>|" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Pages バックエンドが高頻度で即時 "Deployment failed, try again later"
      # を返すため、失敗したら60秒待って同一アーティファクトで再デプロイする。
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000
          error_count: 15
          reporting_interval: 5000

      - if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 15
          reporting_interval: 5000
