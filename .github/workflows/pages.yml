name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/wasm-ocr-browser-app-to2ll3"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true — Pages が未設定なら自動で有効化を試みる
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 公開するのはアプリ本体のみ（tools/ や README は含めない）
      - name: Stage site
        run: |
          mkdir _site
          cp index.html _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
